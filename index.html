<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dieta">
<meta name="theme-color" content="#eef1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101712" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Minha dieta</title>
<style>
:root{
  --bg:#eef1e8; --card:#ffffff; --ink:#1c2a1f; --muted:#667564; --line:#dde3d2;
  --accent:#6f8f1d; --accent-ink:#ffffff; --accent-soft:#e3ecc8;
  --ok:#5b8a1f; --ok-bg:#e1eecb;
  --warn:#b8761a; --warn-bg:#f7e6c6;
  --bad:#c05468; --bad-bg:#f6dde2;
  --idle:#c9d1bd;
  --radius:18px;
  --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101712; --card:#18221b; --ink:#eaf0e2; --muted:#93a38f; --line:#2a382d;
    --accent:#9bc233; --accent-ink:#13200a; --accent-soft:#25331a;
    --ok:#9bc233; --ok-bg:#25331a;
    --warn:#e0a24a; --warn-bg:#3a2d16;
    --bad:#e27a8d; --bad-bg:#3b1f27;
    --idle:#35453a;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.4;
  padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom)) 0;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:18px 16px 24px}
h1{font-size:28px;margin:6px 0 2px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0}

/* Tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav .inner{display:flex;gap:6px;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;padding:8px 4px;border-radius:12px;font-size:13px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);background:var(--accent-soft)}

/* Plate (segmented ring) */
.plate{display:flex;align-items:center;gap:18px}
.plate svg{width:132px;height:132px;flex:none}
.plate .big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.plate .big small{font-size:20px;font-weight:600}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;margin-top:8px}
.chip.met{background:var(--ok-bg);color:var(--ok)}
.chip.progress{background:var(--accent-soft);color:var(--accent)}
.chip.failed{background:var(--bad-bg);color:var(--bad)}
.chip.none{background:var(--line);color:var(--muted)}
.next{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}

/* Meals */
.meal{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px;margin:10px 0}
.meal .check{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--idle);background:none;
  display:grid;place-items:center;color:transparent}
.meal .check svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.meal.st-due .check{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.meal.st-overdue .check,.meal.st-missed .check{border-color:var(--bad)}
.meal.st-ontime .check{background:var(--ok);border-color:var(--ok);color:#fff}
.meal.st-late .check{background:var(--warn);border-color:var(--warn);color:#fff}
.meal.st-skipped .check{background:var(--idle);border-color:var(--idle);color:var(--card)}
.meal .body{flex:1;min-width:0;padding-top:2px}
.meal .title{font-weight:650;font-size:16px}
.meal .time{color:var(--muted);font-weight:500;margin-right:6px;font-variant-numeric:tabular-nums}
.meal .status{font-size:13px;margin-top:2px;color:var(--muted)}
.st-ontime .status{color:var(--ok)} .st-late .status{color:var(--warn)}
.st-overdue .status,.st-missed .status{color:var(--bad)} .st-due .status{color:var(--accent);font-weight:600}
.meal .tip{display:none;white-space:pre-line;font-size:14px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.meal.open .tip{display:block}
.meal .more{flex:none;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px;border-radius:10px}

/* Summary */
.verdict{font-size:17px;font-weight:650;margin:0 0 6px}
.summary p{margin:4px 0;font-size:15px}

/* History */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.dayrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px;margin:8px 0}
.dayrow .d{width:74px;font-weight:600;font-size:14px;flex:none}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.dayrow .p{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--idle)}
.dot.met{background:var(--ok)} .dot.failed{background:var(--bad)} .dot.progress{background:var(--accent)}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;font-size:15px}

/* Settings */
label.f{display:block;margin:12px 0 4px;font-size:14px;font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row .fit{flex:none}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.block{display:block;width:100%;margin-top:8px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.switch input{width:auto;transform:scale(1.3)}
.dows{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dows button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 9px;font-size:13px;font-weight:600;color:var(--muted)}
.dows button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:var(--bg)}
.mhead{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:0;text-align:left}
.mhead span{font-weight:650}
.mhead em{font-style:normal;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.steps{margin:6px 0 0;padding-left:20px;font-size:14px}
.steps li{margin:4px 0}
code{background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-size:14px;word-break:break-all}
.msg{font-size:14px;margin-top:8px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
#modal h2{margin-bottom:2px}
@media (prefers-reduced-motion:no-preference){
  #modal.show .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .plate circle.seg{transition:stroke .25s}
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* v2: extras, peso */
.stats{grid-template-columns:repeat(4,1fr)}
.stat b{font-size:20px}.stat span{font-size:11px}
.stats.auto{grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.xb{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:99px;flex:none}
.extra{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--warn-bg);border:0;border-radius:var(--radius);padding:12px 14px;margin:8px 0}
.extra .tm{font-variant-numeric:tabular-nums;font-weight:700;color:var(--warn)}
.extra .ti{font-weight:650;font-size:15px}.extra .sb2{font-size:13px;color:var(--warn)}
.sec{margin:20px 0 2px}.sec h2{margin:0}
.opts{display:flex;gap:6px;margin-top:8px}
.opts button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.opts button.on{background:var(--warn);border-color:var(--warn);color:#fff}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin:14px 0 4px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.readout{font-size:14px;color:var(--muted);margin-top:2px}.readout b{color:var(--ink);font-size:17px}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}.big small{font-size:18px;font-weight:600;color:var(--muted)}
.formula{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 0;font-size:14px;overflow-x:auto}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.mrow .d{width:92px;font-weight:600;font-size:14px;flex:none}.mrow .v{flex:1;font-size:14px}

/* v3: energia */
details.nt summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.ebar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.ebar .lb{width:122px;flex:none;color:var(--muted);font-size:13px}
.ebar .tr{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.ebar .tr i{display:block;height:100%;border-radius:99px;background:var(--idle)}
.ebar.get .tr i{background:var(--accent)}.ebar.plan .tr i{background:var(--warn)}.ebar.real .tr i{background:var(--ok)}
.ebar b{width:56px;text-align:right;font-variant-numeric:tabular-nums}

/* v4: treino */
.train{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:12px 0}
.train .tdot{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--idle);display:grid;place-items:center;color:#fff}
.train .tdot svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.train b{display:block;font-size:16px}.train .sub{display:block;font-size:13px}
.train.on{background:var(--accent-soft);border-color:var(--accent)}
.train.on .tdot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tb{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:99px;flex:none}

/* v5: treino/corrida */
[hidden]{display:none!important}
.sess{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--accent-soft);border:0;border-radius:var(--radius);padding:12px 14px;margin:8px 0}
.sess .ti{font-weight:650;font-size:15px}.sess .sb2{font-size:13px;color:var(--accent)}
.sess .kc{font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.opts.acc button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<nav><div class="inner" id="tabs"></div></nav>

<script>
/* ============================================================
   Utilidades
   ============================================================ */
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const toMin = t => { const [h,m] = String(t).split(':').map(Number); return (h||0)*60 + (m||0); };
const minToTime = m => `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const nowMin = () => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); };
const fmtDur = m => m < 60 ? `${m} min` : `${Math.floor(m/60)}h${pad(m%60)}`;
const numv = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmtN = (x, d = 1) => Number(x).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtDate = k => { const [y,m,d] = k.split('-'); return `${d}/${m}/${y}`; };
const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DOW_LONG = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const dayLabel = d => `${DOW[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
const pl = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'm' + Math.random().toString(36).slice(2, 8);
const randTopic = () => {
  const a = new Uint8Array(8); crypto.getRandomValues(a);
  return 'dieta-' + Array.from(a, b => (b % 36).toString(36)).join('');
};

/* ============================================================
   Dados (valores iniciais baseados no plano alimentar em PDF)
   ============================================================ */
const ALL = [0,1,2,3,4,5,6], WEEK = [1,2,3,4,5];
const PLAN_V = 2;   // 2 = plano de fev/2024
// Horários sugeridos (o PDF não traz horários). kcal = ESTIMATIVA (média das opções de cada refeição).
const DEFAULT_MEALS = () => [
  { id:'cafe', name:'Café da manhã', notif:'Hora do café da manhã', time:'07:00', days:ALL, enabled:true, kcal:410,
    short:'Proteína + fibra: ovos e pão integral. Mais fome? Adicione 1 a 2 claras.',
    tip:`Meta: começar o dia com proteínas e fibras para ficar saciado.
• Pão com ovos: pão integral 2 fatias (50g), ovos 2 un (90g), requeijão light 1 col sopa (20g), café com leite 1 copo (200 ml).
• Pão de queijo de frigideira: goma de tapioca 3 col sopa (30g), ovos 2 un (90g), mussarela 1 fatia (20g), café com leite 1 copo.
• Wrap com ovos: tortilha 1 un (60g), ovos 2 un (90g), mussarela 1 fatia (20g), tomate e orégano a gosto, café com leite 1 copo.
Mais fome: adicione 1 a 2 claras extras.
Fontes obrigatórias: proteína (ovos) e fibras (pão integral).
Estimativa: ≈ 410 kcal (média das opções).` },
  { id:'colacao', name:'Colação', notif:'Hora da colação', time:'09:00', days:ALL, enabled:true, kcal:230,
    short:'Vitamina de frutas com leite desnatado e whey (20 g).',
    tip:`Meta: refeição leve e equilibrada para não chegar com muita fome no almoço.
• Vitamina de frutas (opção única): leite desnatado 1 copo (200 ml), frutas variadas 1 porção (150g; banana 100g), whey protein 1 dosador (20g). Bata até ficar cremoso.
Fora de casa: shake simples de whey (ou leite em pó desnatado 20g) e coma a fruta separada.
Evite a banana aqui, pois ela entra em outra refeição.
Estimativa: ≈ 230 kcal.` },
  { id:'almoco', name:'Almoço', notif:'Hora do almoço', time:'12:00', days:ALL, enabled:true, kcal:590,
    short:'Porção GRANDE de carne e vegetais, com salada à vontade.',
    tip:`Meta: porção GRANDE de carnes e vegetais.
• Exemplo 1: arroz branco 2 col servir (180g), feijão preto 1 concha cheia (150g), frango grelhado 1 bifão (120g).
• Exemplo 2: macarrão 2 col servir (180g), feijão preto 1 concha cheia (150g), carne moída 2 col servir (120g).
• Exemplo 3: batata assada 2 col servir (180g), feijão preto 1 concha cheia (150g), tilápia grelhada 1 bifão (120g).
Legumes e salada crua: à vontade (BASTANTE).
Sem leguminosa: aumente o cereal para 220g (batata inglesa: 240g).
Evite frituras e excesso de queijo. Molhos: tomate, mostarda, espinafre, moranga, molho branco de ricota.
Estimativa: ≈ 590 kcal (média dos exemplos).` },
  { id:'lanchet', name:'Lanche da tarde', notif:'Hora do lanche da tarde', time:'14:00', days:ALL, enabled:true, kcal:320,
    short:'Não pule! Sanduíche com pão integral e recheio proteico.',
    tip:`Meta: NÃO PULE a refeição. Equilibrada e gostosa, para ficar saciado e render nos treinos.
Base: pão integral 2 fatias (50g) + uma opção:
• Ovos: 2 ovos cozidos (90g) + requeijão light 1 col sopa (20g) + saladas.
• Frango: desfiado 4 col sopa (80g) + creme de ricota 1 col sopa (20g) + saladas.
• Atum: enlatado 4 col sopa (80g) + maionese light 1 col sopa (20g) + saladas.
• Caprese: ricota 3 fatias (50g) + mussarela 1 fatia (20g) + tomate e orégano.
• Carne: de gado 4 col sopa (80g) + mussarela 1 fatia (20g) + saladas.
Dias corridos: sanduíche sem recheio proteico + shake simples de whey.
Estimativa: ≈ 320 kcal (média das opções).` },
  { id:'jantar', name:'Jantar', notif:'Hora do jantar', time:'17:00', days:ALL, enabled:true, kcal:590,
    short:'Repita o almoço (fim de semana: wrap, burguer ou pizza de pão sírio).',
    tip:`Durante a semana: repita o almoço. Fins de semana:
• Wrap de Big Mac: tortilha 1 un (60g), carne moída crua 5 col sopa (120g), mussarela 1 fatia (20g), saladas.
• Burguer caseiro: pão francês 1 un (50g), hambúrguer caseiro 1 un (150g), mussarela 1 fatia (20g), alface e tomate; molhos sem calorias (ketchup e mostarda).
• Pizza com pão sírio: pão árabe 1 un (60g), molho de tomate 4 col sopa, frango desfiado 5 col sopa (120g), mussarela 2 fatias (30g), brócolis e milho à vontade.
Estimativa: ≈ 590 kcal na semana (igual ao almoço); fins de semana ≈ 480 a 560 kcal.` },
  { id:'ceia', name:'Ceia', notif:'Hora da ceia', time:'22:00', days:ALL, enabled:true, kcal:440,
    short:'Iogurte com frutas ou bolo de banana, com whey.',
    tip:`Pode ajustar a ordem desta refeição (atenção aos treinos).
• Iogurte com frutas: iogurte natural 1 pote (170g), banana 1 un (100g), whey 1 dosador (20g), granola 3 col sopa (20g), pasta de amendoim 1 col sobremesa (15g).
• Bolo de banana: banana 1 un (100g), 1 ovo + 1 clara, aveia em flocos 3 col sopa (20g), whey 1 porção (20g), pasta de amendoim 1 col sobremesa (15g). Amasse parte da banana, misture ovos, aveia, whey e canela, junte fermento (1 col chá) e leve ao microondas 2 a 3 min.
Estimativa: ≈ 440 kcal (média das opções).` },
];
const DEFAULT_STATE = () => ({
  v: 1,
  startDate: dayKey(new Date()),
  settings: {
    goalType: 'percent',      // percent | all | ontime | maxlate
    goalValue: 80,
    tolerance: 60,            // minutos de tolerância após o horário
    ntfyOn: true,
    server: 'https://ntfy.sh',

const STORE = 'dieta-app-v1';
function migrateWorkouts(w){        // formato antigo {at} vira lista de sessões
  const o = {};
  for(const k in (w || {})){
    const v = w[k];
    o[k] = Array.isArray(v) ? v : [{ id:uid(), type:'gym', ab:null, min:45, at:(v && v.at) || null }];
  }
  return o;
}
function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(raw){
      const s = JSON.parse(raw), d = DEFAULT_STATE();
      const out = { ...d, ...s, settings: { ...d.settings, ...(s.settings||{}) } };
      if(s.planV === undefined) out.planV = 1;   // dados antigos: plano de 2022
      out.workouts = migrateWorkouts(out.workouts);
      return out;
    }
  }catch(e){}
  return DEFAULT_STATE();
}
let state = load();
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
save();

/* ============================================================
   Cálculo do dia
   ============================================================ */
function mealsFor(key){
  const h = (state.planHistory || []).slice().sort((a, b) => a.until.localeCompare(b.until));
  for(const e of h) if(key <= e.until) return e.meals;
  return state.meals;
}

function dayStats(key){
  const date = parseKey(key), dow = date.getDay();
  const today = dayKey(new Date());
  const isToday = key === today, isPast = key < today;
  const nm = nowMin(), tol = Number(state.settings.tolerance) || 0;
  const entries = state.log[key] || {};
  const items = mealsFor(key)
    .filter(m => m.enabled && m.days.includes(dow))
    .sort((a,b) => toMin(a.time) - toMin(b.time))
    .map(m => {
      const e = entries[m.id];
      const start = toMin(m.time), end = start + tol;
      let st, late = 0, at = null;
      if(e && e.status === 'done'){
        at = toMin(e.at); late = Math.max(0, at - end); st = late > 0 ? 'late' : 'ontime';
      } else if(e && e.status === 'skipped'){ st = 'skipped'; }
      else if(isPast) st = 'missed';
      else if(!isToday) st = 'upcoming';
      else if(nm < start) st = 'upcoming';
      else if(nm <= end) st = 'due';
      else st = 'overdue';
      return { meal:m, st, late, at, start, end };
    });
  const c = k => items.filter(i => i.st === k).length;
  const s = {
    key, isToday, isPast, items,
    planned: items.length,
    ontime: c('ontime'), late: c('late'), skipped: c('skipped'), missed: c('missed'),
    due: c('due'), overdue: c('overdue'), upcoming: c('upcoming'),
    lateMin: items.reduce((a,i) => a + i.late, 0),
  };
  s.done = s.ontime + s.late;
  s.extras = (state.extras[key] || []).slice().sort((a,b) => toMin(a.at) - toMin(b.at));
  s.extraN = s.extras.length;
  s.ratio = s.planned ? s.done / s.planned : 0;
  s.pct = Math.round(s.ratio * 100);
  s.goal = evalGoal(s);
  return s;
}

function baseGoal(s){
  const g = state.settings, v = Number(g.goalValue) || 0, final = !s.isToday;
  if(!s.planned) return { st:'none' };
  const problems = s.late + s.skipped + s.missed + s.overdue;
  switch(g.goalType){
    case 'percent': {
      if(s.ratio * 100 >= v) return { st:'met' };
      if(final) return { st:'failed' };
      const best = (s.planned - s.skipped) / s.planned * 100;
      return { st: best >= v ? 'progress' : 'failed' };
    }
    case 'all':
      if(s.done === s.planned) return { st:'met' };
      if(final || s.skipped > 0) return { st:'failed' };
      return { st:'progress' };
    case 'ontime':
      if(s.ontime === s.planned) return { st:'met' };
      if(final || problems > 0) return { st:'failed' };
      return { st:'progress' };
    case 'maxlate':
      if(problems > v) return { st:'failed' };
      if(final || s.upcoming + s.due === 0) return { st:'met' };
      return { st:'progress' };
  }
  return { st:'none' };
}

function evalGoal(s){
  const r = baseGoal(s), g = state.settings;
  if(r.st !== 'none' && g.extrasCount && s.extraN > (Number(g.extrasMax) || 0)) return { st:'failed', byExtras:true };
  return r;
}

function goalText(){
  const g = state.settings, v = Number(g.goalValue) || 0;
  return {
    percent: `Seguir pelo menos ${v}% da dieta`,
    all: 'Fazer todas as refeições do dia',
    ontime: 'Fazer todas as refeições dentro do horário',
    maxlate: `No máximo ${pl(v, 'refeição atrasada ou pulada', 'refeições atrasadas ou puladas')}`,
  }[g.goalType];
}
function goalChip(st, isToday){
  const t = {
    met: 'Meta atingida',
    progress: 'Meta em andamento',
    failed: isToday ? 'Meta fora de alcance hoje' : 'Meta não atingida',
    none: 'Sem refeições hoje',
  }[st];
  return `<span class="chip ${st}">${t}</span>`;
}

function verdict(s){
  if(!s.planned) return 'Nenhuma refeição planejada neste dia.';
  const st = s.goal.st;
  if(s.isToday && st === 'progress') return 'O dia está em andamento.';
  if(s.goal.byExtras) return 'Você passou do limite de refeições extras.';
  if(st === 'met') return (s.ontime === s.planned && !s.extraN) ? 'Dia perfeito: tudo feito no horário.' : 'Você bateu a meta do dia.';
  return s.isToday ? 'A meta de hoje já não dá para bater.' : 'Dessa vez a meta não foi atingida.';
}
function summaryLines(s){
  if(!s.planned) return [];
  const L = [];
  L.push(`${s.done} de ${s.planned} refeições feitas: ${s.pct}% da dieta.`);
  if(s.ontime) L.push(`${pl(s.ontime, 'refeição', 'refeições')} no horário.`);
  if(s.late) L.push(`${pl(s.late, 'refeição', 'refeições')} fora da janela de horário, somando ${fmtDur(s.lateMin)} de atraso.`);
  if(s.skipped) L.push(`${pl(s.skipped, 'refeição pulada', 'refeições puladas')}.`);
  if(s.missed) L.push(`${pl(s.missed, 'refeição sem registro', 'refeições sem registro')}.`);
  if(s.overdue) L.push(`${pl(s.overdue, 'refeição aguardando seu check', 'refeições aguardando seu check')}.`);
  if(s.upcoming + s.due) L.push(`Ainda ${s.upcoming + s.due === 1 ? 'falta' : 'faltam'} ${s.upcoming + s.due} no dia.`);
  if(s.extraN) L.push(`${pl(s.extraN, 'refeição extra', 'refeições extras')} fora da dieta (${s.extras.map(e => e.at).join(', ')}).`);
  if(s.extraN && state.settings.extrasCount) L.push(`Limite de extras por dia: ${state.settings.extrasMax}.`);
  const ss = sess(s.key);
  if(ss.length){
    const kc = trainKcal(s.key);
    L.push(`Treino: ${ss.map(x => x.type === 'run' ? `corrida ${fmtN(x.km, 1)} km` : `treino${x.ab ? ' ' + x.ab : ''} (${x.min} min)`).join(' + ')}${kc ? ` (≈ ${fmtN(kc, 0)} kcal)` : ''}.`);
  }
  return L;
}

function statusText(it){
  const win = `${it.meal.time}–${minToTime(it.end)}`;
  switch(it.st){
    case 'ontime':  return `Feito às ${minToTime(it.at)} · no horário`;
    case 'late':    return `Feito às ${minToTime(it.at)} · ${fmtDur(it.late)} fora da janela`;
    case 'skipped': return 'Pulada';
    case 'missed':  return 'Sem registro';
    case 'due':     return `Agora · janela até ${minToTime(it.end)}`;
    case 'overdue': return `Atrasada · janela era ${win}`;
    default:        return `Janela ${win}`;
  }
}

function plateSVG(s){
  const n = Math.max(s.planned, 1), r = 54, C = 2*Math.PI*r;
  const gap = n > 1 ? 5 : 0, len = C/n - gap;
  const color = { ontime:'var(--ok)', late:'var(--warn)', skipped:'var(--bad)', missed:'var(--bad)', overdue:'var(--bad)', due:'var(--accent)', upcoming:'var(--idle)' };
  let segs = '';
  for(let i = 0; i < s.planned; i++){
    const it = s.items[i];
    const dim = it.st === 'due' ? ' opacity=".55"' : '';
    segs += `<circle class="seg" cx="66" cy="66" r="${r}" fill="none" stroke="${color[it.st]}" stroke-width="14"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-(i*C/n + gap/2)}" transform="rotate(-90 66 66)"${dim}/>`;
  }
  if(!s.planned) segs = `<circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--idle)" stroke-width="14"/>`;
  return `<svg viewBox="0 0 132 132" role="img" aria-label="${s.done} de ${s.planned} refeições feitas">${segs}</svg>`;
}

function mealList(s){
  if(!s.items.length) return `<div class="card sub">Nenhuma refeição planejada neste dia. Ajuste os dias de cada refeição em Ajustes.</div>`;
  return s.items.map(it => {
    const m = it.meal, open = openTips.has(m.id);
    return `<div class="meal st-${it.st} ${open?'open':''}">
      <button class="check" data-act="toggle" data-id="${m.id}" data-day="${s.key}" aria-label="Marcar ${esc(m.name)} como feita">${ICONS.check}</button>
      <div class="body" data-act="tip" data-id="${m.id}">
        <div class="title"><span class="time">${m.time}</span>${esc(m.name)}</div>
        <div class="status">${statusText(it)}</div>
        <div class="tip">${esc(m.tip) || 'Sem descrição.'}</div>
      </div>
      <button class="more" data-act="more" data-id="${m.id}" data-day="${s.key}" aria-label="Mais opções">⋯</button>
    </div>`;
  }).join('');
}

const XSIZE = { pequena:'Beliscada', lanche:'Lanche', grande:'Refeição completa' };
const extraChip = s => s.extraN ? `<span class="chip warn" style="margin-left:6px">${pl(s.extraN, 'extra', 'extras')}</span>` : '';

  return `<div class="sec"><h2>Fora da dieta</h2></div>

function summaryCard(s, title){
  if(!s.planned) return '';
  return `<div class="card summary">
    <h2>${title}</h2>

function sessLine(s){
  if(s.type === 'run'){
    const ps = paceSecs(s.pace), t = ps ? Math.round(ps * s.km) : null;
    return `Corrida · ${fmtN(s.km, 1)} km${s.pace ? ' · pace ' + s.pace : ''}${t ? ' · ' + Math.floor(t / 60) + ':' + pad(t % 60) + ' min' : ''}`;
  }
  return `Treino${s.ab ? ' ' + s.ab : ''} · ${s.min} min`;
}
function trainBlock(key){
  const cards = sess(key).map(s => { const kc = sessionKcal(s, key);
    return `<button class="sess" data-act="sedit" data-day="${key}" data-id="${s.id}">
      <div><div class="ti">${sessLine(s)}</div><div class="sb2">${s.at ? 'registrado às ' + s.at : 'registrado depois'}</div></div>
      <span class="kc">${kc != null ? '≈ ' + fmtN(kc, 0) + ' kcal' : '–'}</span></button>`; }).join('');
  return `<div class="sec"><h2>Treino e corrida</h2></div>
    ${cards || '<div class="sub" style="margin:6px 0">Nenhum treino registrado.</div>'}
    <button class="btn block" data-act="sadd" data-day="${key}">+ Registrar treino ou corrida</button>`;
}
function trainBadges(k){
  const t = new Set(sess(k).map(x => x.type));
  return (t.has('gym') ? '<span class="tb">Treino</span>' : '') + (t.has('run') ? '<span class="tb">Corrida</span>' : '');

function planBanner(){
  if((state.planV || 1) >= PLAN_V || state.planDismiss) return '';
  return `<div class="card" style="border-color:var(--accent)"><b>Novo plano alimentar disponível (fev/2024)</b>

    <button class="btn block" data-act="planlater">Agora não</button></div>`;

function renderToday(){
  const now = new Date(), s = dayStats(dayKey(now));
  let next = '';
  const due = s.items.find(i => i.st === 'due');
  const up = s.items.find(i => i.st === 'upcoming');
  if(due) next = `<b>Agora:</b> ${esc(due.meal.name)}, com janela até ${minToTime(due.end)}.`;
  else if(up) next = `<b>Próxima:</b> ${esc(up.meal.name)} às ${up.meal.time} (em ${fmtDur(up.start - nowMin())}).`;
  else if(s.planned) next = s.overdue ? `Você tem ${pl(s.overdue, 'refeição esperando', 'refeições esperando')} seu check.` : 'Todas as refeições do dia já passaram.';
  if(s.overdue && (due || up)) next += ` <span style="color:var(--bad)">${pl(s.overdue, 'atrasada', 'atrasadas')}.</span>`;

  const schedInfo = scheduleInfo();
  const warn = (state.settings.ntfyOn && !schedInfo.ok)
    ? `<div class="card" style="border-color:var(--warn)"><b>Lembretes não agendados.</b>
       <div class="sub">${esc(schedInfo.msg)} Abra Ajustes para configurar.</div></div>` : '';

  return `
    <h1>Hoje</h1>
    <div class="sub">${DOW_LONG[now.getDay()]}, ${pad(now.getDate())}/${pad(now.getMonth()+1)}</div>

      <div class="plate">

          <div class="sub">${s.done} de ${s.planned} refeições</div>
          ${goalChip(s.goal.st, true)}${extraChip(s)}
        </div>
      </div>
      ${next ? `<div class="next">${next}</div>` : ''}
    </div>
    ${mealList(s)}
    ${extrasBlock(s)}
    ${trainBlock(s.key)}
    ${summaryCard(s, 'Resumo do dia')}
  `;

function trackedDays(n){
  const out = [], start = state.startDate;
  const d = new Date();
  for(let i = 0; i < n; i++){
    const k = dayKey(d);
    if(k < start) break;
    out.push(k);
    d.setDate(d.getDate() - 1);
  }
  return out;
}

function trainCard(){
  const keys = trackedDays(30), today = dayKey(new Date());
  const cnt = (ks, t) => ks.reduce((a, k) => a + sess(k).filter(x => x.type === t).length, 0);
  const k7 = keys.slice(0, 7);
  const kcDia = keys.length ? keys.reduce((a, k) => a + trainKcal(k), 0) / keys.length : 0;
  const withT = [], without = [];
  keys.forEach(k => { if(k === today) return; const st = dayStats(k); if(!st.planned) return; (sess(k).length ? withT : without).push(st.pct); });
  const avg = a => Math.round(a.reduce((x, y) => x + y, 0) / a.length);
  const cmp = (withT.length && without.length)
    ? `<p class="sub" style="margin:10px 0 0">Dieta em dias de treino: <b>${avg(withT)}%</b> (${pl(withT.length, 'dia', 'dias')}) · em dias sem treino: <b>${avg(without)}%</b> (${pl(without.length, 'dia', 'dias')}).</p>` : '';
  return `<div class="card"><h2>Treino e corrida</h2>
    <div class="stats auto"><div class="stat"><b>${cnt(k7, 'gym')}</b><span>treinos (7 dias)</span></div>
      <div class="stat"><b>${cnt(k7, 'run')}</b><span>corridas (7 dias)</span></div>
      <div class="stat"><b>${fmtN(kcDia, 0)}</b><span>kcal/dia de treino (30 dias)</span></div></div>${cmp}</div>`;
}

function renderHistory(){
  if(view.day){
    const s = dayStats(view.day), d = parseKey(view.day);
    return `
      <button class="back" data-act="back">‹ Histórico</button>
      <h1>${dayLabel(d)}</h1>
      <div class="sub">${DOW_LONG[d.getDay()]}</div>
      <div class="card"><div class="plate">${plateSVG(s)}
        <div><div class="big">${s.pct}<small>%</small></div>
        <div class="sub">${s.done} de ${s.planned} refeições</div>${goalChip(s.goal.st, s.isToday)}${extraChip(s)}</div></div></div>
      ${mealList(s)}
      ${extrasBlock(s)}
      ${trainBlock(s.key)}
      ${summaryCard(s, 'Resumo')}`;
  }
  const keys = trackedDays(14);
  const stats = keys.map(dayStats);
  const week = stats.slice(0, 7).filter(x => x.planned);
  const avg = week.length ? Math.round(week.reduce((a,x) => a + x.pct, 0) / week.length) : 0;
  const met = week.filter(x => x.goal.st === 'met').length;
  const extras7 = stats.slice(0, 7).reduce((a, x) => a + x.extraN, 0);
  // sequência: dias seguidos com meta atingida (hoje só conta se já atingiu)
  let streak = 0;
  for(let i = 0; i < stats.length; i++){
    const x = stats[i];
    if(!x.planned) continue;
    if(x.goal.st === 'met') streak++;
    else if(i === 0 && x.isToday) continue;
    else break;
  }
  const rows = stats.map(x => {
    const d = parseKey(x.key);
    return `<button class="dayrow" data-act="day" data-day="${x.key}">
      <span class="d">${x.isToday ? 'Hoje' : dayLabel(d)}</span>
      <span class="bar"><i style="width:${x.pct}%"></i></span>
      <span class="p">${x.planned ? x.pct + '%' : '–'}</span>
      ${trainBadges(x.key)}
      ${x.extraN ? `<span class="xb">+${x.extraN}</span>` : ''}
      <span class="dot ${x.goal.st}" title="${x.goal.st}"></span>
    </button>`;
  }).join('');
  return `
    <h1>Histórico</h1>
    <div class="sub">Meta: ${goalText()}</div>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><b>${avg}%</b><span>média 7 dias</span></div>
      <div class="stat"><b>${met}/${week.length}</b><span>dias com meta</span></div>
      <div class="stat"><b>${streak}</b><span>${streak === 1 ? 'dia seguido' : 'dias seguidos'}</span></div>
      <div class="stat"><b>${extras7}</b><span>extras (7 dias)</span></div>
    </div>
    ${trainCard()}
    <div style="margin-top:16px">${rows}</div>
    <p class="note">Toque em um dia para ver ou corrigir os registros.</p>`;
}

const bodySorted = () => state.body.slice().sort((a, b) => a.date.localeCompare(b.date));

function chartCard(id, title, pts, unit, d, color, minPad){
  if(!pts.length) return `<div class="card"><h2>${title}</h2><div class="sub">Sem medições neste período.</div></div>`;
  const sel = pts.find(p => p.k === ui.sel[id]) || pts[pts.length - 1];
  const W = 340, H = 180, L = 40, R = 14, T = 14, B = 26;
  const ys = pts.map(p => p.y); let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = Math.max((hi - lo) * 0.25, minPad); lo -= pad; hi += pad;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const X = t => t1 === t0 ? L + (W - L - R) / 2 : L + (t - t0) / (t1 - t0) * (W - L - R);
  const Y = y => T + (1 - (y - lo) / (hi - lo)) * (H - T - B);
  const grid = [0, .5, 1].map(f => { const v = lo + (hi - lo) * f, y = Y(v).toFixed(1);
    return `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="ax" x="${L - 6}" y="${(+y + 3).toFixed(1)}" text-anchor="end">${fmtN(v, d)}</text>`; }).join('');
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const dots = pts.map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${p.k === sel.k ? 6 : 3.5}" style="fill:${color}${p.k === sel.k ? ';stroke:var(--card);stroke-width:2' : ''}"/>`).join('');
  const hits = pts.map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="16" fill="transparent" data-act="pt" data-c="${id}" data-k="${p.k}" style="cursor:pointer"/>`).join('');
  const short = k => k.slice(8) + '/' + k.slice(5, 7);
  const xl = pts.length > 1
    ? `<text class="ax" x="${L}" y="${H - 6}">${short(pts[0].k)}</text><text class="ax" x="${W - R}" y="${H - 6}" text-anchor="end">${short(pts[pts.length - 1].k)}</text>`
    : `<text class="ax" x="${L + (W - L - R) / 2}" y="${H - 6}" text-anchor="middle">${short(pts[0].k)}</text>`;
  const dv = pts[pts.length - 1].y - pts[0].y;
  const delta = pts.length > 1 ? `<div class="sub">No período: ${dv >= 0 ? '+' : '−'}${fmtN(Math.abs(dv), d)} ${unit}</div>` : '';
  return `<div class="card"><h2>${title}</h2>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ${title}">${grid}<path class="ln" d="${path}" style="stroke:${color}"/>${dots}${xl}${hits}</svg>
    <div class="readout"><b>${fmtN(sel.y, d)} ${unit}</b> · ${fmtDate(sel.k)}</div>${delta}</div>`;
}
/* ---------- Energia: comendo × gastando ---------- */
const FA_PRESETS = [[1.2,'Sedentário (1,2)'],[1.3,'Pouco ativo (1,3)'],[1.4,'Ativo no dia a dia (1,4)'],[1.5,'Muito ativo, trabalho físico (1,5)']];
const GYM_LEVELS = [[3.0,'Leve (3,0 MET)'],[4.0,'Moderado (4,0 MET)'],[5.5,'Intenso (5,5 MET)']];
const fcom = x => String(x).replace('.', ',');
function ageFrom(birth){
  const b = parseKey(birth), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  if(n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
  return a;
}
function energyCalc(){
  const g = state.settings, all = bodySorted(), last = all[all.length - 1];
  const miss = [];
  if(!last) miss.push('uma medição de peso');
  if(!g.height) miss.push('altura');
  if(!g.sex) miss.push('sexo');
  if(!g.birth) miss.push('data de nascimento');
  if(miss.length) return { miss };
  const W = last.w, H = g.height, A = ageFrom(g.birth), M = g.sex === 'M';
  const lastBF = all.slice().reverse().find(x => x.bf != null);
  let use = g.formula === 'auto' ? (lastBF ? 'katch' : 'mifflin') : g.formula;
  const fallback = use === 'katch' && !lastBF;
  if(fallback) use = 'mifflin';
  let tmb, name, lines;
  if(use === 'katch'){
    const ffm = W * (1 - lastBF.bf / 100);
    tmb = 370 + 21.6 * ffm; name = 'Katch-McArdle';
    lines = [`MLG = peso × (1 − %gordura/100) = ${fcom(W)} × (1 − ${fcom(lastBF.bf)}/100) = ${fmtN(ffm)} kg`,
             `TMB = 370 + (21,6 × MLG) = 370 + (21,6 × ${fmtN(ffm)}) = ${fmtN(tmb, 0)} kcal`];
  } else {
    const c0 = M ? 5 : -161, sg = c0 < 0 ? '−' : '+';
    tmb = 10 * W + 6.25 * H - 5 * A + c0; name = 'Mifflin-St Jeor';
    lines = [`TMB = (10 × peso) + (6,25 × altura) − (5 × idade) ${sg} ${Math.abs(c0)}`,
             `TMB = (10 × ${fcom(W)}) + (6,25 × ${fcom(H)}) − (5 × ${A}) ${sg} ${Math.abs(c0)} = ${fmtN(tmb, 0)} kcal`];
  }
  const fa = Number(g.faBase) || 1.3, get = tmb * fa;       // get = gasto do dia SEM treino
  lines.push(`Gasto sem treino = TMB × FA = ${fmtN(tmb, 0)} × ${fcom(fa)} = ${fmtN(get, 0)} kcal`);
  lines.push('Gasto do dia = gasto sem treino + calorias dos treinos e corridas do dia');
  return { tmb, get, fa, name, lines, fallback, W, A, bfDate: use === 'katch' ? lastBF.date : null };
}
function planKcal(dow){
  const ms = state.meals.filter(m => m.enabled && m.days.includes(dow));
  return { kcal: ms.reduce((a, m) => a + (Number(m.kcal) || 0), 0), missing: ms.filter(m => m.kcal == null || m.kcal === '').length };
}
function dayIntake(key){        // kcal estimadas do dia (refeições marcadas + extras); null se não der para calcular
  const ents = state.log[key] || {}, ex = state.extras[key] || [], ek = state.settings.extraKcal || {};
  let k = 0, any = false;
  for(const m of mealsFor(key)){
    const e = ents[m.id]; if(!e) continue;
    any = true;
    if(e.status === 'done'){ if(m.kcal == null) return null; k += Number(m.kcal) || 0; }
  }
  ex.forEach(e => { any = true; k += Number(ek[e.size]) || 0; });
  return any ? k : null;
}

/* ---------- treino e corrida: calorias ---------- */
const sess = k => state.workouts[k] || [];
const paceSecs = p => { const m = /^(\d{1,2}):(\d{2})$/.exec(p || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
function weightAt(key){         // peso medido mais recente até a data (ou o primeiro registrado)
  const all = bodySorted(); if(!all.length) return null;
  let w = all[0].w;
  for(const x of all){ if(x.date <= key) w = x.w; else break; }
  return w;
}
function sessionKcal(s, key){   // gasto ACIMA do repouso (o repouso já está na TMB × FA)
  const W = weightAt(key); if(W == null) return null;
  if(s.type === 'run') return 1.0 * W * (Number(s.km) || 0);                          // ACSM: ~1,0 kcal/kg/km, terreno plano
  const met = Number((state.settings.gym || {}).met) || 4;
  return (met - 1) * W * ((Number(s.min) || 0) / 60);                                  // (MET − 1) × kg × horas
}
const trainKcal = k => sess(k).reduce((a, x) => a + (sessionKcal(x, k) || 0), 0);
function avgTrain(n){
  const d = new Date(); let sum = 0, c = 0;
  for(let i = 0; i < n; i++){ const k = dayKey(d); if(k >= state.startDate){ sum += trainKcal(k); c++; } d.setDate(d.getDate() - 1); }
  return c ? sum / c : 0;
}
function balanceWindow(n, E){   // média dos últimos n dias com registro (hoje fica de fora: ainda incompleto)
  const d = new Date(), days = [];
  for(let i = 0; i < n; i++){
    d.setDate(d.getDate() - 1); const k = dayKey(d);
    if(k < state.startDate) break;
    const intake = dayIntake(k); if(intake == null) continue;
    const train = trainKcal(k);
    days.push({ intake, train, exp: E.get + train });
  }
  if(!days.length) return null;
  const avg = f => days.reduce((a, x) => a + f(x), 0) / days.length;
  return { n: days.length, intake: avg(x => x.intake), train: avg(x => x.train), exp: avg(x => x.exp), saldo: avg(x => x.intake - x.exp) };
}
/* ---------- calibração: gasto aparente a partir de comido + tendência do peso ---------- */
const utcDays = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
function weightSlope(pts){      // kg por dia (regressão linear simples)
  const t = pts.map(p => utcDays(p.date)), n = pts.length;
  const mt = t.reduce((a, b) => a + b, 0) / n, mw = pts.reduce((a, p) => a + p.w, 0) / n;
  let num = 0, den = 0;
  pts.forEach((p, i) => { num += (t[i] - mt) * (p.w - mw); den += (t[i] - mt) ** 2; });
  return den ? num / den : null;
}
function calibCard(){
  const E = energyCalc(); if(E.miss) return '';
  const N = 28, d0 = new Date(); d0.setDate(d0.getDate() - N);
  const pts = bodySorted().filter(x => x.date >= dayKey(d0));
  const B = balanceWindow(N, E), nDays = B ? B.n : 0;
  const span = pts.length > 1 ? utcDays(pts[pts.length - 1].date) - utcDays(pts[0].date) : 0;
  const okW = pts.length >= 2 && span >= 10, okD = nDays >= 7;
  const mark = ok => ok ? '✓' : '○';
  if(!okW || !okD){
    return `<div class="card"><h2>Calibração do gasto</h2>
      <p class="sub" style="margin-top:0">O app compara o que você comeu com a variação do seu peso para descobrir quanto você realmente gasta. Ainda faltam dados (últimos 28 dias):</p>
      <p style="margin:6px 0">${mark(okD)} Dias com refeições registradas: <b>${nDays}</b> (mínimo 7)</p>
      <p style="margin:6px 0">${mark(okW)} Pesagens no período: <b>${pts.length}</b> (mínimo 2, com 10 dias ou mais entre a primeira e a última; o ideal é 1 por semana)</p>
      <p class="note">Registre o peso em "Nova medição" (o % de gordura é opcional). Pese-se sempre no mesmo horário, de preferência em jejum.</p></div>`;
  }
  const slope = weightSlope(pts), first = pts[0], last = pts[pts.length - 1];
  const real = B.intake - slope * 7700;
  const diff = real - B.exp, pct = diff / B.exp * 100;
  const faSug = (real - B.train) / E.tmb;
  const conf = (pts.length >= 5 && nDays >= 14) ? ['Boa', '±150'] : (pts.length >= 3 && nDays >= 10) ? ['Média', '±250'] : ['Baixa', '±400 ou mais'];
  const sgn = x => x >= 0 ? '+' : '−';
  let verdict;
  if(Math.abs(pct) < 7) verdict = 'A fórmula está batendo com a evolução do seu peso.';
  else verdict = `A fórmula parece ${diff > 0 ? 'subestimar' : 'superestimar'} o seu gasto em cerca de ${fmtN(Math.abs(diff), 0)} kcal/dia (${fmtN(Math.abs(pct), 0)}%).`;
  const faOk = faSug >= 1.1 && faSug <= 2.0;
  const faLine = faOk
    ? `<p style="margin:10px 0 0">Fator de atividade que explicaria o período: <b>${fcom(faSug.toFixed(2))}</b> (hoje: ${fcom(E.fa)}).</p>
       ${Math.abs(faSug - E.fa) >= 0.03 ? `<button class="btn block" data-act="usefa" data-v="${faSug.toFixed(2)}">Usar fator ${fcom(faSug.toFixed(2))}</button>` : ''}`
    : `<p class="note">O fator calculado (${fcom(faSug.toFixed(2))}) está fora do esperado (1,1 a 2,0): provavelmente faltam refeições ou extras registrados, ou o peso oscilou muito. Não aplique.</p>`;
  return `<div class="card"><h2>Calibração do gasto</h2>
    <div class="sub">Últimos 28 dias: ${nDays} ${nDays === 1 ? 'dia' : 'dias'} com refeições registradas e ${pts.length} pesagens.</div>
    <div class="formula">Tendência do peso: ${sgn(slope)}${fmtN(Math.abs(slope * 7), 2)} kg/semana (${fmtN(first.w)} kg em ${fmtDate(first.date)} → ${fmtN(last.w)} kg em ${fmtDate(last.date)})<br>
      Gasto aparente = comido − (variação do peso × 7.700 kcal/kg)<br>
      = ${fmtN(B.intake, 0)} − (${fmtN(slope, 3).replace('-', '−')} kg/dia × 7.700) = <b>${fmtN(real, 0)} kcal/dia</b><br>
      Pela fórmula (média do período): ${fmtN(B.exp, 0)} kcal/dia</div>
    <div style="margin-top:12px"><span class="chip progress" style="margin-top:0">${sgn(diff)}${fmtN(Math.abs(diff), 0)} kcal/dia em relação à fórmula</span></div>
    <p style="margin:8px 0 0"><b>${verdict}</b></p>
    ${faLine}
    <p class="sub" style="margin:10px 0 0">Confiança: <b>${conf[0]}</b> (incerteza aproximada de ${conf[1]} kcal/dia).</p>
    <p class="note">O gasto aparente junta tudo: o gasto real, os erros nas calorias estimadas das refeições e o que você comeu sem registrar. Se esquece de marcar refeições ou extras, ele fica menor que o real. Oscilações de 1 kg por água, sal e carboidrato são normais entre pesagens, por isso mais pesagens no mesmo horário deixam o resultado mais confiável. O % de gordura não entra aqui, porque medições de métodos diferentes não são comparáveis.</p>
  </div>`;
}
function energyCard(){
  const E = energyCalc();
  if(E.miss) return `<div class="card"><h2>Energia: comendo × gastando</h2>
    <div class="sub">Para estimar seu gasto, complete em "Seus dados" (mais abaixo): ${E.miss.join(', ')}.</div></div>`;

  const P = planKcal(new Date().getDay()), B = balanceWindow(nWin, E), tr14 = avgTrain(14);
  const dias = n => n === 1 ? 'dia' : 'dias';
  const rows = [['Basal (TMB)', E.tmb, 'tmb']];
  rows.push(B ? [`Gasto médio (${B.n} ${dias(B.n)})`, B.exp, 'get'] : ['Gasto (sem treino)', E.get, 'get']);
  rows.push(['Dieta (plano)', P.kcal, 'plan']);
  if(B) rows.push([`Comido (${B.n} ${dias(B.n)})`, B.intake, 'real']);
  const max = Math.max(...rows.map(r => r[1]), 1) * 1.05;
  const bars = rows.map(([l, v, c]) => `<div class="ebar ${c}"><span class="lb">${l}</span><span class="tr"><i style="width:${(v / max * 100).toFixed(1)}%"></i></span><b>${fmtN(v, 0)}</b></div>`).join('');
  const sgn = x => x >= 0 ? '+' : '−';
  let head;
  if(B){
    const sTxt = Math.abs(B.saldo) < 100 ? 'Perto da manutenção' : B.saldo > 0 ? 'Superávit médio' : 'Déficit médio';
    head = `<div style="margin-top:12px"><span class="chip progress" style="margin-top:0">${sTxt}: ${sgn(B.saldo)}${fmtN(Math.abs(B.saldo), 0)} kcal/dia</span></div>
      <p class="sub" style="margin:8px 0 0">Média dos últimos ${B.n} ${dias(B.n)} com registro: comido ${fmtN(B.intake, 0)} − gasto ${fmtN(B.exp, 0)} (sem treino ${fmtN(E.get, 0)} + treino ${fmtN(B.train, 0)}) = ${sgn(B.saldo)}${fmtN(Math.abs(B.saldo), 0)} kcal/dia.
      Em teoria, cerca de ${sgn(B.saldo)}${fmtN(Math.abs(B.saldo) * 7 / 7700, 2)} kg por semana.</p>`;
  } else {
    const sp = P.kcal - (E.get + tr14);
    head = `<p class="sub" style="margin:12px 0 0"><b>Ainda não há dias com registro para calcular o saldo real.</b> Marque suas refeições por alguns dias (o app não conta o dia de hoje, que ainda está incompleto).
      Pelo plano, sem contar extras: dieta − gasto médio = ${fmtN(P.kcal, 0)} − ${fmtN(E.get + tr14, 0)} = ${sgn(sp)}${fmtN(Math.abs(sp), 0)} kcal/dia.</p>`;
  }
  return `<div class="card"><h2>Energia: comendo × gastando</h2>
    <div class="seg">${[['7','7 dias'],['14','14 dias'],['30','30 dias']].map(([k, l]) => `<button class="${String(nWin) === k ? 'on' : ''}" data-act="erange" data-r="${k}">${l}</button>`).join('')}</div>
    ${bars}
    ${head}
    ${P.missing ? `<p class="note">Faltam calorias em ${pl(P.missing, 'refeição', 'refeições')}: preencha em Ajustes > Refeições.</p>` : ''}
    ${E.fallback ? `<p class="note">Katch-McArdle precisa do % de gordura; usando Mifflin-St Jeor.</p>` : ''}
    <details class="nt"><summary>Ver fórmulas (${E.name})</summary>
      <div class="formula">${E.lines.join('<br>')}<br>Treino: (MET − 1) × peso × horas · Corrida: 1,0 × peso × km</div>
      ${E.bfDate ? `<p class="note">Usa o último % de gordura medido (${fmtDate(E.bfDate)}) e o peso atual.</p>` : ''}
    </details>
    <p class="note">São estimativas: as calorias da dieta são a média das opções de cada refeição, e o gasto real costuma variar 10 a 15%. As calorias de treino contam só o gasto acima do repouso (o repouso já está na TMB × FA); não some o valor do relógio por cima. Use a evolução do peso e do % de gordura para calibrar. "Comido" soma as refeições marcadas mais as extras (estimadas em Ajustes), só nos dias com registro.</p>
  </div>`;
}

    const im = imcInfo(last.w), hasBF = last.bf != null;

    const dl = prev ? last.w - prev.w : null;
    summary = `<div class="card">
      <div class="sub">${fmtDate(last.date)}</div>
      <div class="big">${fmtN(last.w)} <small>kg</small></div>

          <div class="stat"><b>${fmtN(fat)}</b><span>massa gorda (kg)</span></div>
          <div class="stat"><b>${fmtN(lean)}</b><span>massa magra (kg)</span></div>` : ''}

      ${im ? `<div style="margin-top:12px"><span class="chip ${im.cls}" style="margin-top:0">${im.label}</span></div>

    const im = imcInfo(x.w);

  return `<h1>Evolução</h1>
    <div class="sub">Peso, IMC, % de gordura e energia</div>
    ${summary}
    <button class="btn primary block" data-act="badd">+ Nova medição</button>

    ${calibCard()}
    ${dataCard()}

      ${withBF.length ? chartCard('f', '% de gordura', mk(withBF, x => x.bf), '%', 1, 'var(--warn)', 0.5) : ''}

}

function nextAB(key){           // sugere o treino contrário ao último A/B registrado
  const ks = Object.keys(state.workouts).filter(k => k < key).sort().reverse();
  for(const k of ks){
    const g = sess(k).filter(x => x.type === 'gym' && x.ab).pop();
    if(g) return g.ab === 'A' ? 'B' : 'A';
  }
  return 'A';
}

function setLog(key, id, entry){
  state.log[key] = state.log[key] || {};
  if(entry) state.log[key][id] = entry; else delete state.log[key][id];
  save();
}

function applyPlan(){
  const old = state.meals, byId = Object.fromEntries(old.map(m => [m.id, m]));
  const legacy = { colacao:'lanche', lanchet:'fruta', ceia:'pos' };      // equivalentes do plano de 2022 (para manter horários)
  const fresh = DEFAULT_MEALS();
  fresh.forEach(m => { const o = byId[m.id] || byId[legacy[m.id]]; if(o && o.time) m.time = o.time; });
  const y = new Date(); y.setDate(y.getDate() - 1);
  const until = dayKey(y);
  state.planHistory = state.planHistory || [];
  const lastH = state.planHistory[state.planHistory.length - 1];
  if(!lastH || lastH.until !== until) state.planHistory.push({ until, meals:old });
  state.meals = fresh; state.planV = PLAN_V; state.planDismiss = false;
  save();
}
const PLAN_MSG = 'Aplicar o plano de fev/2024?\n\nSeu histórico antigo é preservado e os horários atuais são mantidos. Lembretes antigos já agendados (como lanche da manhã, fruta e pré/pós-treino) ainda podem chegar por até 3 dias; para descartá-los, use "Gerar novo tópico" em Ajustes.';

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id, key = el.dataset.day;
  const today = dayKey(new Date());

  switch(act){
    case 'tab': view = { tab: el.dataset.tab, day: null }; render(); scrollTo(0,0); break;
    case 'day': view.day = key; render(); scrollTo(0,0); break;
    case 'back': view.day = null; render(); break;
    case 'tip': openTips.has(id) ? openTips.delete(id) : openTips.add(id); render(); break;
    case 'toggle': {
      const cur = (state.log[key] || {})[id];
      if(cur && cur.status === 'done'){ setLog(key, id, null); render(); }
      else if(key === today){ setLog(key, id, { status:'done', at: minToTime(nowMin()) }); render(); schedule(); }
      else { modalCtx = { kind:'meal', key, id }; renderModal(); }
      break;
    }
    case 'more': modalCtx = { kind:'meal', key, id }; renderModal(); break;
    case 'msave': {
      const t = $('#modalTime').value || minToTime(nowMin());
      setLog(modalCtx.key, modalCtx.id, { status:'done', at:t }); modalCtx = null; renderModal(); render(); break;
    }
    case 'mskip': setLog(modalCtx.key, modalCtx.id, { status:'skipped' }); modalCtx = null; renderModal(); render(); break;
    case 'mclear': setLog(modalCtx.key, modalCtx.id, null); modalCtx = null; renderModal(); render(); break;
    case 'mclose': modalCtx = null; renderModal(); break;

    case 'sadd': modalCtx = { kind:'sess', key, id:null }; renderModal(); break;
    case 'sedit': modalCtx = { kind:'sess', key, id }; renderModal(); break;
    case 'stype':
      modalCtx.stype = el.dataset.t;
      document.querySelectorAll('#stypes button').forEach(b => b.classList.toggle('on', b === el));
      $('#gymF').hidden = modalCtx.stype !== 'gym'; $('#runF').hidden = modalCtx.stype !== 'run';
      sessPreview(); break;
    case 'sab':
      modalCtx.ab = modalCtx.ab === el.dataset.v ? null : el.dataset.v;
      document.querySelectorAll('#sabs button').forEach(b => b.classList.toggle('on', b.dataset.v === modalCtx.ab)); break;
    case 'ssave': {
      const list = state.workouts[modalCtx.key] = state.workouts[modalCtx.key] || [];
      const old = modalCtx.id ? list.find(x => x.id === modalCtx.id) : null;
      const type = modalCtx.stype || 'gym';
      const ns = { id: old ? old.id : uid(), type, at: old ? old.at : (modalCtx.key === today ? minToTime(nowMin()) : null) };
      if(type === 'gym'){
        ns.ab = modalCtx.ab || null; ns.min = numv($('#sMin').value);
        if(!(ns.min > 0)){ alert('Informe a duração em minutos.'); break; }
      } else {
        ns.km = numv($('#sKm').value);
        if(!(ns.km > 0)){ alert('Informe a distância em km.'); break; }
        const pc = $('#sPace').value.trim(); ns.pace = paceSecs(pc) ? pc : null;
      }
      if(old) list[list.indexOf(old)] = ns; else list.push(ns);
      save(); modalCtx = null; renderModal(); render(); break;
    }
    case 'sdel':
      state.workouts[modalCtx.key] = sess(modalCtx.key).filter(x => x.id !== modalCtx.id);
      if(!state.workouts[modalCtx.key].length) delete state.workouts[modalCtx.key];
      save(); modalCtx = null; renderModal(); render(); break;
    case 'erange': ui.eRange = el.dataset.r; render(); break;
    case 'usefa': { const v = Number(el.dataset.v); if(v >= 1.1 && v <= 2.0){ state.settings.faBase = v; save(); render(); } break; }
    case 'xadd': modalCtx = { kind:'extra', key, id:null }; renderModal(); break;
    case 'xedit': modalCtx = { kind:'extra', key, id }; renderModal(); break;
    case 'xsize':
      modalCtx.size = el.dataset.s;
      document.querySelectorAll('.opts button').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'xsave': {
      const at = $('#xTime').value || minToTime(nowMin()), note = $('#xNote').value.trim(), size = modalCtx.size || 'lanche';
      const arr = state.extras[modalCtx.key] = state.extras[modalCtx.key] || [];
      if(modalCtx.id){ const e = arr.find(x => x.id === modalCtx.id); if(e) Object.assign(e, { at, note, size }); }
      else arr.push({ id:uid(), at, note, size });
      save(); modalCtx = null; renderModal(); render(); break;
    }
    case 'xdel': {
      state.extras[modalCtx.key] = (state.extras[modalCtx.key] || []).filter(x => x.id !== modalCtx.id);
      if(!state.extras[modalCtx.key].length) delete state.extras[modalCtx.key];
      save(); modalCtx = null; renderModal(); render(); break;
    }
    case 'badd': modalCtx = { kind:'body', id:null }; renderModal(); break;
    case 'bedit': modalCtx = { kind:'body', id }; renderModal(); break;
    case 'bsave': {
      const date = $('#bDate').value, w = numv($('#bW').value), bfRaw = $('#bF').value.trim(), bf = bfRaw === '' ? null : numv(bfRaw);
      if(!date){ alert('Informe a data.'); break; }
      if(w == null || w < 20 || w > 400){ alert('Informe um peso válido (em kg).'); break; }
      if(bfRaw !== '' && (bf == null || bf < 2 || bf > 70)){ alert('O % de gordura deve ficar entre 2 e 70.'); break; }
      if(modalCtx.id && modalCtx.id !== date) state.body = state.body.filter(x => x.date !== modalCtx.id);
      state.body = state.body.filter(x => x.date !== date);
      state.body.push({ date, w, bf });
      save(); modalCtx = null; renderModal(); render(); break;
    }
    case 'bdel':
      if(confirm('Excluir esta medição?')){ state.body = state.body.filter(x => x.date !== modalCtx.id); save(); modalCtx = null; renderModal(); render(); }
      break;
    case 'range': ui.range = el.dataset.r; render(); break;
    case 'pt': ui.sel[el.dataset.c] = el.dataset.k; render(); break;
    case 'mopen': openMeals.has(id) ? openMeals.delete(id) : openMeals.add(id); render(); break;
    case 'dow': {
      const m = state.meals.find(x => x.id === id), d = Number(el.dataset.d);
      m.days = m.days.includes(d) ? m.days.filter(x => x !== d) : [...m.days, d].sort();
      save(); render(); break;
    }
    case 'mdel':
      if(confirm('Excluir esta refeição?')){ state.meals = state.meals.filter(x => x.id !== id); save(); render(); }
      break;
    case 'madd': {
      const m = { id: uid(), name:'Nova refeição', notif:'Hora da nova refeição', time:'16:00', days:[...ALL], enabled:true, tip:'' };
      state.meals.push(m); openMeals.add(m.id); save(); render(); break;
    }
    case 'mreset':
      if(confirm(PLAN_MSG)){ applyPlan(); render(); schedule(); }
      break;
    case 'applyplan':
      if(confirm(PLAN_MSG)){ applyPlan(); render(); schedule(); scrollTo(0,0); }
      break;
    case 'planlater': state.planDismiss = true; save(); render(); break;

    case 'copytopic':
      try{ await navigator.clipboard.writeText(state.settings.topic); notice = { notif:'Tópico copiado.' }; }
      catch(e){ const b = $('#topicBox'); b.select(); notice = { notif:'Selecione e copie o tópico manualmente.', notifErr:true }; }
      render(); break;
    case 'newtopic':
      if(confirm('Gerar um novo tópico? Você precisará assinar o novo nome no app ntfy, e os lembretes já agendados no tópico antigo deixam de chegar.')){
        state.settings.topic = randTopic(); state.scheduled = {}; save();
        notice = { notif:'Novo tópico criado. Assine-o no ntfy e toque em "Agendar lembretes agora".' }; render();
      }
      break;
    case 'test':
      try{
        await publish({ title:'Teste de lembrete', message:'Se você viu isso, as notificações da dieta estão funcionando.' });
        notice = { notif:'Teste enviado. Deve chegar em alguns segundos.' };
      }catch(e){ notice = { notif:'Não foi possível enviar: ' + e.message, notifErr:true }; }
      render(); break;
    case 'resched': {
      notice = { notif:'Agendando...' }; render();
      const r = await schedule(true);
      notice = { notif: r.msg, notifErr: !r.ok }; render(); break;
    }
    case 'export':
      try{ await navigator.clipboard.writeText(JSON.stringify(state)); notice = { backup:'Backup copiado. Cole em um lugar seguro (Notas, e-mail).' }; }
      catch(e){ $('#importBox').value = JSON.stringify(state); notice = { backup:'Copie o texto da caixa abaixo.' }; }
      render(); break;
    case 'import':
      try{
        const raw = $('#importBox').value.trim(); const s = JSON.parse(raw);
        if(!s.meals || !s.settings || !s.log) throw new Error('formato inválido');
        state = { ...DEFAULT_STATE(), ...s, settings: { ...DEFAULT_STATE().settings, ...s.settings } };
        if(s.planV === undefined) state.planV = 1;
        state.workouts = migrateWorkouts(state.workouts);
        save(); notice = { backup:'Backup restaurado.' };
      }catch(e){ notice = { backup:'Backup inválido: ' + e.message, backupErr:true }; }
      render(); break;
    case 'wipe':
      if(confirm('Apagar todo o histórico de checks? As configurações são mantidas.')){
        state.log = {}; state.extras = {}; state.workouts = {}; state.startDate = dayKey(new Date()); save(); render();
      }
      break;
  }
});

document.addEventListener('change', ev => {
  const el = ev.target;
  if(el.dataset.set){
    const k = el.dataset.set;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if(['goalValue','tolerance','extrasMax'].includes(k)) v = Math.max(0, Number(v) || 0);
    if(k === 'height'){ const n = numv(v); v = n && n > 50 && n < 250 ? n : null; }
    if(k === 'server') v = String(v).trim() || 'https://ntfy.sh';
    if(k === 'fa' || k === 'faBase') v = Number(v) || 1.3;
    if(k.startsWith('gym_') || k.startsWith('run_')){
      const [o, f] = k.split('_');
      if(f === 'pace' && !/^\d{1,2}:\d{2}$/.test(String(v).trim())){ alert('Use o formato min:seg, por exemplo 4:50.'); render(); return; }
      state.settings[o] = { ...state.settings[o], [f]: f === 'pace' ? String(v).trim() : (numv(v) || 0) };
      save(); render(); return;
    }
    if(k === 'sex' || k === 'birth') v = v || null;
    if(k.startsWith('ek_')){ state.settings.extraKcal = { ...state.settings.extraKcal, [k.slice(3)]: Math.max(0, Number(v) || 0) }; save(); render(); return; }
    state.settings[k] = v; save(); render();
    if(['ntfyOn','closeOn','closeTime','server'].includes(k)) schedule();
  } else if(el.dataset.meal){
    const m = state.meals.find(x => x.id === el.dataset.meal); if(!m) return;
    const fld = el.dataset.field;
    m[fld] = el.type === 'checkbox' ? el.checked : fld === 'kcal' ? numv(el.value) : el.value;
    if(el.dataset.field === 'name' && /^Hora d/.test(m.notif || '') === false && !m.notif) m.notif = 'Hora de ' + m.name;
    save(); render();
    if(['time','enabled'].includes(el.dataset.field)) schedule();
  }
});

/* ============================================================
   Lembretes via ntfy (agendados com antecedência no servidor)
   ============================================================ */
async function publish(extra){
  const s = state.settings;
  const body = {
    topic: s.topic, tags: ['fork_and_knife'],
    click: location.origin + location.pathname,
    ...extra,
  };
  const r = await fetch(s.server.replace(/\/+$/, '') + '/', { method:'POST', body: JSON.stringify(body) });
  if(!r.ok) throw new Error('servidor respondeu ' + r.status);
}

function scheduleInfo(){
  const s = state.settings;
  if(!s.ntfyOn) return { ok:false, msg:'Notificações desligadas.' };
  const now = Date.now();
  const times = Object.values(state.scheduled).filter(t => t > now);
  if(!times.length) return { ok:false, msg:'Nenhum lembrete agendado ainda. Configure o ntfy e toque em "Agendar lembretes agora".' };
  const last = new Date(Math.max(...times));
  return { ok:true, msg:`${pl(times.length, 'lembrete agendado', 'lembretes agendados')}, até ${dayLabel(last)} às ${pad(last.getHours())}:${pad(last.getMinutes())}. Abra o app ao menos a cada 2 dias para renovar.` };
}

let scheduling = false;
async function schedule(manual){
  const s = state.settings;
  if(!s.ntfyOn) return { ok:false, msg:'Notificações desligadas.' };
  if(scheduling) return { ok:true, msg:'Agendamento em andamento.' };
  scheduling = true;
  try{
    const now = Date.now(), events = [];
    for(let off = 0; off <= 3; off++){
      const d = new Date(); d.setDate(d.getDate() + off); d.setHours(0,0,0,0);
      const key = dayKey(d), dow = d.getDay();
      const at = hhmm => { const [h,mi] = hhmm.split(':').map(Number); const t = new Date(d); t.setHours(h, mi, 0, 0); return t.getTime(); };
      state.meals.filter(m => m.enabled && m.days.includes(dow)).forEach(m =>
        events.push({ k:`${key}|${m.id}|${m.time}`, t:at(m.time), title: m.notif || ('Hora de ' + m.name), msg: m.short || m.tip || '' }));
      if(s.closeOn) events.push({ k:`${key}|close|${s.closeTime}`, t:at(s.closeTime),
        title:'Hora de fechar o dia', msg:'Abra o app, confira seus checks e veja o resumo do dia.' });
    }
    const MAX = 71 * 3600e3;
    let sent = 0;
    for(const ev of events){
      const delta = ev.t - now;
      if(delta < 30e3 || delta > MAX || state.scheduled[ev.k]) continue;
      await publish({ title: ev.title, message: ev.msg || ev.title, delay: Math.round(delta/1000) + 's' });
      state.scheduled[ev.k] = ev.t; sent++;
      await new Promise(r => setTimeout(r, 120));
    }
    for(const k in state.scheduled) if(state.scheduled[k] < now - 86400e3) delete state.scheduled[k];
    save();
    const info = scheduleInfo();
    return { ok: info.ok, msg: sent ? `${pl(sent, 'novo lembrete agendado', 'novos lembretes agendados')}. ` + info.msg : info.msg };
  }catch(e){
    save();
    return { ok:false, msg:'Falha ao agendar: ' + e.message + '. Verifique a internet e o servidor.' };
  }finally{
    scheduling = false;
    if(view.tab === 'today' && !manual && !modalCtx) render();
  }
}

const $tabs = document.getElementById('tabs');

$modal.addEventListener('click', e => { if(e.target === $modal){ modalCtx = null; renderModal(); } });

document.addEventListener('input', ev => { if(['sMin', 'sKm', 'sPace'].includes(ev.target.id)) sessPreview(); });

render();
schedule();
setInterval(() => { if(!document.hidden && view.tab === 'today' && !modalCtx) render(); }, 30000);

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
