<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dieta">
<meta name="theme-color" content="#eef1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101712" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Minha dieta</title>
<style>
:root{
  --bg:#eef1e8; --card:#ffffff; --ink:#1c2a1f; --muted:#667564; --line:#dde3d2;
  --accent:#6f8f1d; --accent-ink:#ffffff; --accent-soft:#e3ecc8;
  --ok:#5b8a1f; --ok-bg:#e1eecb;
  --warn:#b8761a; --warn-bg:#f7e6c6;
  --bad:#c05468; --bad-bg:#f6dde2;
  --idle:#c9d1bd;
  --radius:18px;
  --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101712; --card:#18221b; --ink:#eaf0e2; --muted:#93a38f; --line:#2a382d;
    --accent:#9bc233; --accent-ink:#13200a; --accent-soft:#25331a;
    --ok:#9bc233; --ok-bg:#25331a;
    --warn:#e0a24a; --warn-bg:#3a2d16;
    --bad:#e27a8d; --bad-bg:#3b1f27;
    --idle:#35453a;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.4;
  padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom)) 0;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:18px 16px 24px}
h1{font-size:28px;margin:6px 0 2px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0}

/* Tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav .inner{display:flex;gap:6px;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;padding:8px 4px;border-radius:12px;font-size:13px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);background:var(--accent-soft)}

/* Plate (segmented ring) */
.plate{display:flex;align-items:center;gap:18px}
.plate svg{width:132px;height:132px;flex:none}
.plate .big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.plate .big small{font-size:20px;font-weight:600}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;margin-top:8px}
.chip.met{background:var(--ok-bg);color:var(--ok)}
.chip.progress{background:var(--accent-soft);color:var(--accent)}
.chip.failed{background:var(--bad-bg);color:var(--bad)}
.chip.none{background:var(--line);color:var(--muted)}
.next{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}

/* Meals */
.meal{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px;margin:10px 0}
.meal .check{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--idle);background:none;
  display:grid;place-items:center;color:transparent}
.meal .check svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.meal.st-due .check{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.meal.st-overdue .check,.meal.st-missed .check{border-color:var(--bad)}
.meal.st-ontime .check{background:var(--ok);border-color:var(--ok);color:#fff}
.meal.st-late .check{background:var(--warn);border-color:var(--warn);color:#fff}
.meal.st-skipped .check{background:var(--idle);border-color:var(--idle);color:var(--card)}
.meal .body{flex:1;min-width:0;padding-top:2px}
.meal .title{font-weight:650;font-size:16px}
.meal .time{color:var(--muted);font-weight:500;margin-right:6px;font-variant-numeric:tabular-nums}
.meal .status{font-size:13px;margin-top:2px;color:var(--muted)}
.st-ontime .status{color:var(--ok)} .st-late .status{color:var(--warn)}
.st-overdue .status,.st-missed .status{color:var(--bad)} .st-due .status{color:var(--accent);font-weight:600}
.meal .tip{display:none;font-size:14px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.meal.open .tip{display:block}
.meal .more{flex:none;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px;border-radius:10px}

/* Summary */
.verdict{font-size:17px;font-weight:650;margin:0 0 6px}
.summary p{margin:4px 0;font-size:15px}

/* History */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.dayrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px;margin:8px 0}
.dayrow .d{width:74px;font-weight:600;font-size:14px;flex:none}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.dayrow .p{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--idle)}
.dot.met{background:var(--ok)} .dot.failed{background:var(--bad)} .dot.progress{background:var(--accent)}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;font-size:15px}

/* Settings */
label.f{display:block;margin:12px 0 4px;font-size:14px;font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row .fit{flex:none}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.block{display:block;width:100%;margin-top:8px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.switch input{width:auto;transform:scale(1.3)}
.dows{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dows button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 9px;font-size:13px;font-weight:600;color:var(--muted)}
.dows button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:var(--bg)}
.mhead{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:0;text-align:left}
.mhead span{font-weight:650}
.mhead em{font-style:normal;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.steps{margin:6px 0 0;padding-left:20px;font-size:14px}
.steps li{margin:4px 0}
code{background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-size:14px;word-break:break-all}
.msg{font-size:14px;margin-top:8px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
#modal h2{margin-bottom:2px}
@media (prefers-reduced-motion:no-preference){
  #modal.show .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .plate circle.seg{transition:stroke .25s}
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<nav><div class="inner" id="tabs"></div></nav>

<script>
/* ============================================================
   Utilidades
   ============================================================ */
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const toMin = t => { const [h,m] = String(t).split(':').map(Number); return (h||0)*60 + (m||0); };
const minToTime = m => `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const nowMin = () => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); };
const fmtDur = m => m < 60 ? `${m} min` : `${Math.floor(m/60)}h${pad(m%60)}`;
const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DOW_LONG = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const dayLabel = d => `${DOW[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
const pl = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'm' + Math.random().toString(36).slice(2, 8);
const randTopic = () => {
  const a = new Uint8Array(8); crypto.getRandomValues(a);
  return 'dieta-' + Array.from(a, b => (b % 36).toString(36)).join('');
};

/* ============================================================
   Dados (valores iniciais baseados no plano alimentar em PDF)
   ============================================================ */
const ALL = [0,1,2,3,4,5,6], WEEK = [1,2,3,4,5];
const DEFAULT_MEALS = () => [
  { id:'cafe',   name:'Café da manhã',   notif:'Hora do café da manhã',   time:'07:00', days:ALL,  enabled:true,
    tip:'Carboidrato + proteína: pão com ovo, crepioca, tapioca crocante, bruschetta, misto quente, muffin salgado ou pão de queijo, com café com leite desnatado.' },
  { id:'lanche', name:'Lanche da manhã', notif:'Hora do lanche da manhã', time:'09:00', days:ALL,  enabled:true,
    tip:'Bowl de iogurte, panqueca de banana, crepe de chocolate ou mingau de aveia, com ½ dose de whey e uma porção de fruta.' },
  { id:'almoco', name:'Almoço',          notif:'Hora do almoço',          time:'12:00', days:ALL,  enabled:true,
    tip:'Cereal (arroz, macarrão, batata) + 2 conchas de feijão + 100 g de proteína + legumes e salada à vontade.' },
  { id:'fruta',  name:'Fruta',           notif:'Hora da fruta',           time:'14:00', days:ALL,  enabled:true,
    tip:'1 porção (200 g) de fruta, de preferência cítrica. Se estiver em casa, pode comer a pipoca da ceia agora.' },
  { id:'jantar', name:'Jantar',          notif:'Hora do jantar',          time:'17:00', days:ALL,  enabled:true,
    tip:'Repita o almoço. Nos fins de semana: pizza de pão sírio, hambúrguer caseiro ou pastel.' },
  { id:'pre',    name:'Pré-treino',      notif:'Hora do pré-treino',      time:'20:00', days:WEEK, enabled:true,
    tip:'Carboidrato simples e leve: rabanada saudável ou bowl de frutas. Não esqueça a creatina.' },
  { id:'pos',    name:'Pós-treino',      notif:'Hora do pós-treino',      time:'22:00', days:WEEK, enabled:true,
    tip:'Batida de frutas com leite desnatado, banana e ½ dose de whey (+ pipoca, se ainda não comeu).' },
];
const DEFAULT_STATE = () => ({
  v: 1,
  startDate: dayKey(new Date()),
  settings: {
    goalType: 'percent',      // percent | all | ontime | maxlate
    goalValue: 80,
    tolerance: 60,            // minutos de tolerância após o horário
    ntfyOn: true,
    server: 'https://ntfy.sh',
    topic: randTopic(),
    closeOn: true,
    closeTime: '23:30',
  },
  meals: DEFAULT_MEALS(),
  log: {},                    // log[YYYY-MM-DD][mealId] = {status:'done'|'skipped', at:'HH:MM'}
  scheduled: {},              // lembretes já agendados no ntfy
});

const STORE = 'dieta-app-v1';
function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(raw){
      const s = JSON.parse(raw), d = DEFAULT_STATE();
      return { ...d, ...s, settings: { ...d.settings, ...(s.settings||{}) } };
    }
  }catch(e){}
  return DEFAULT_STATE();
}
let state = load();
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
save();

/* ============================================================
   Cálculo do dia
   ============================================================ */
function dayStats(key){
  const date = parseKey(key), dow = date.getDay();
  const today = dayKey(new Date());
  const isToday = key === today, isPast = key < today;
  const nm = nowMin(), tol = Number(state.settings.tolerance) || 0;
  const entries = state.log[key] || {};
  const items = state.meals
    .filter(m => m.enabled && m.days.includes(dow))
    .sort((a,b) => toMin(a.time) - toMin(b.time))
    .map(m => {
      const e = entries[m.id];
      const start = toMin(m.time), end = start + tol;
      let st, late = 0, at = null;
      if(e && e.status === 'done'){
        at = toMin(e.at); late = Math.max(0, at - end); st = late > 0 ? 'late' : 'ontime';
      } else if(e && e.status === 'skipped'){ st = 'skipped'; }
      else if(isPast) st = 'missed';
      else if(!isToday) st = 'upcoming';
      else if(nm < start) st = 'upcoming';
      else if(nm <= end) st = 'due';
      else st = 'overdue';
      return { meal:m, st, late, at, start, end };
    });
  const c = k => items.filter(i => i.st === k).length;
  const s = {
    key, isToday, isPast, items,
    planned: items.length,
    ontime: c('ontime'), late: c('late'), skipped: c('skipped'), missed: c('missed'),
    due: c('due'), overdue: c('overdue'), upcoming: c('upcoming'),
    lateMin: items.reduce((a,i) => a + i.late, 0),
  };
  s.done = s.ontime + s.late;
  s.ratio = s.planned ? s.done / s.planned : 0;
  s.pct = Math.round(s.ratio * 100);
  s.goal = evalGoal(s);
  return s;
}

function evalGoal(s){
  const g = state.settings, v = Number(g.goalValue) || 0, final = !s.isToday;
  if(!s.planned) return { st:'none' };
  const problems = s.late + s.skipped + s.missed + s.overdue;
  switch(g.goalType){
    case 'percent': {
      if(s.ratio * 100 >= v) return { st:'met' };
      if(final) return { st:'failed' };
      const best = (s.planned - s.skipped) / s.planned * 100;
      return { st: best >= v ? 'progress' : 'failed' };
    }
    case 'all':
      if(s.done === s.planned) return { st:'met' };
      if(final || s.skipped > 0) return { st:'failed' };
      return { st:'progress' };
    case 'ontime':
      if(s.ontime === s.planned) return { st:'met' };
      if(final || problems > 0) return { st:'failed' };
      return { st:'progress' };
    case 'maxlate':
      if(problems > v) return { st:'failed' };
      if(final || s.upcoming + s.due === 0) return { st:'met' };
      return { st:'progress' };
  }
  return { st:'none' };
}

function goalText(){
  const g = state.settings, v = Number(g.goalValue) || 0;
  return {
    percent: `Seguir pelo menos ${v}% da dieta`,
    all: 'Fazer todas as refeições do dia',
    ontime: 'Fazer todas as refeições dentro do horário',
    maxlate: `No máximo ${pl(v, 'refeição atrasada ou pulada', 'refeições atrasadas ou puladas')}`,
  }[g.goalType];
}
function goalChip(st, isToday){
  const t = {
    met: 'Meta atingida',
    progress: 'Meta em andamento',
    failed: isToday ? 'Meta fora de alcance hoje' : 'Meta não atingida',
    none: 'Sem refeições hoje',
  }[st];
  return `<span class="chip ${st}">${t}</span>`;
}

function verdict(s){
  if(!s.planned) return 'Nenhuma refeição planejada neste dia.';
  const st = s.goal.st;
  if(s.isToday && st === 'progress') return 'O dia está em andamento.';
  if(st === 'met') return s.ontime === s.planned ? 'Dia perfeito: tudo feito no horário.' : 'Você bateu a meta do dia.';
  return s.isToday ? 'A meta de hoje já não dá para bater.' : 'Dessa vez a meta não foi atingida.';
}
function summaryLines(s){
  if(!s.planned) return [];
  const L = [];
  L.push(`${s.done} de ${s.planned} refeições feitas: ${s.pct}% da dieta.`);
  if(s.ontime) L.push(`${pl(s.ontime, 'refeição', 'refeições')} no horário.`);
  if(s.late) L.push(`${pl(s.late, 'refeição', 'refeições')} fora da janela de horário, somando ${fmtDur(s.lateMin)} de atraso.`);
  if(s.skipped) L.push(`${pl(s.skipped, 'refeição pulada', 'refeições puladas')}.`);
  if(s.missed) L.push(`${pl(s.missed, 'refeição sem registro', 'refeições sem registro')}.`);
  if(s.overdue) L.push(`${pl(s.overdue, 'refeição aguardando seu check', 'refeições aguardando seu check')}.`);
  if(s.upcoming + s.due) L.push(`Ainda ${s.upcoming + s.due === 1 ? 'falta' : 'faltam'} ${s.upcoming + s.due} no dia.`);
  return L;
}

function statusText(it){
  const win = `${it.meal.time}–${minToTime(it.end)}`;
  switch(it.st){
    case 'ontime':  return `Feito às ${minToTime(it.at)} · no horário`;
    case 'late':    return `Feito às ${minToTime(it.at)} · ${fmtDur(it.late)} fora da janela`;
    case 'skipped': return 'Pulada';
    case 'missed':  return 'Sem registro';
    case 'due':     return `Agora · janela até ${minToTime(it.end)}`;
    case 'overdue': return `Atrasada · janela era ${win}`;
    default:        return `Janela ${win}`;
  }
}

/* ============================================================
   Interface
   ============================================================ */
let view = { tab:'today', day:null };
const openTips = new Set(), openMeals = new Set();
let modalCtx = null, notice = {};

const ICONS = {
  today: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>',
  history: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  settings: '<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
};

function renderTabs(){
  const tabs = [['today','Hoje'],['history','Histórico'],['settings','Ajustes']];
  $tabs.innerHTML = tabs.map(([k,l]) =>
    `<button class="${view.tab===k?'on':''}" data-act="tab" data-tab="${k}">${ICONS[k]}${l}</button>`).join('');
}

function plateSVG(s){
  const n = Math.max(s.planned, 1), r = 54, C = 2*Math.PI*r;
  const gap = n > 1 ? 5 : 0, len = C/n - gap;
  const color = { ontime:'var(--ok)', late:'var(--warn)', skipped:'var(--bad)', missed:'var(--bad)', overdue:'var(--bad)', due:'var(--accent)', upcoming:'var(--idle)' };
  let segs = '';
  for(let i = 0; i < s.planned; i++){
    const it = s.items[i];
    const dim = it.st === 'due' ? ' opacity=".55"' : '';
    segs += `<circle class="seg" cx="66" cy="66" r="${r}" fill="none" stroke="${color[it.st]}" stroke-width="14"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-(i*C/n + gap/2)}" transform="rotate(-90 66 66)"${dim}/>`;
  }
  if(!s.planned) segs = `<circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--idle)" stroke-width="14"/>`;
  return `<svg viewBox="0 0 132 132" role="img" aria-label="${s.done} de ${s.planned} refeições feitas">${segs}</svg>`;
}

function mealList(s){
  if(!s.items.length) return `<div class="card sub">Nenhuma refeição planejada neste dia. Ajuste os dias de cada refeição em Ajustes.</div>`;
  return s.items.map(it => {
    const m = it.meal, open = openTips.has(m.id);
    return `<div class="meal st-${it.st} ${open?'open':''}">
      <button class="check" data-act="toggle" data-id="${m.id}" data-day="${s.key}" aria-label="Marcar ${esc(m.name)} como feita">${ICONS.check}</button>
      <div class="body" data-act="tip" data-id="${m.id}">
        <div class="title"><span class="time">${m.time}</span>${esc(m.name)}</div>
        <div class="status">${statusText(it)}</div>
        <div class="tip">${esc(m.tip) || 'Sem descrição.'}</div>
      </div>
      <button class="more" data-act="more" data-id="${m.id}" data-day="${s.key}" aria-label="Mais opções">⋯</button>
    </div>`;
  }).join('');
}

function summaryCard(s, title){
  if(!s.planned) return '';
  return `<div class="card summary">
    <h2>${title}</h2>
    <p class="verdict">${verdict(s)}</p>
    ${summaryLines(s).map(l => `<p>${l}</p>`).join('')}
    <p class="sub" style="margin-top:8px">Meta: ${goalText()}.</p>
  </div>`;
}

function renderToday(){
  const now = new Date(), s = dayStats(dayKey(now));
  let next = '';
  const due = s.items.find(i => i.st === 'due');
  const up = s.items.find(i => i.st === 'upcoming');
  if(due) next = `<b>Agora:</b> ${esc(due.meal.name)}, com janela até ${minToTime(due.end)}.`;
  else if(up) next = `<b>Próxima:</b> ${esc(up.meal.name)} às ${up.meal.time} (em ${fmtDur(up.start - nowMin())}).`;
  else if(s.planned) next = s.overdue ? `Você tem ${pl(s.overdue, 'refeição esperando', 'refeições esperando')} seu check.` : 'Todas as refeições do dia já passaram.';
  if(s.overdue && (due || up)) next += ` <span style="color:var(--bad)">${pl(s.overdue, 'atrasada', 'atrasadas')}.</span>`;

  const schedInfo = scheduleInfo();
  const warn = (state.settings.ntfyOn && !schedInfo.ok)
    ? `<div class="card" style="border-color:var(--warn)"><b>Lembretes não agendados.</b>
       <div class="sub">${esc(schedInfo.msg)} Abra Ajustes para configurar.</div></div>` : '';

  return `
    <h1>Hoje</h1>
    <div class="sub">${DOW_LONG[now.getDay()]}, ${pad(now.getDate())}/${pad(now.getMonth()+1)}</div>
    ${warn}
    <div class="card">
      <div class="plate">
        ${plateSVG(s)}
        <div>
          <div class="big">${s.pct}<small>%</small></div>
          <div class="sub">${s.done} de ${s.planned} refeições</div>
          ${goalChip(s.goal.st, true)}
        </div>
      </div>
      ${next ? `<div class="next">${next}</div>` : ''}
    </div>
    ${mealList(s)}
    ${summaryCard(s, 'Resumo do dia')}
  `;
}

function trackedDays(n){
  const out = [], start = state.startDate;
  const d = new Date();
  for(let i = 0; i < n; i++){
    const k = dayKey(d);
    if(k < start) break;
    out.push(k);
    d.setDate(d.getDate() - 1);
  }
  return out;
}

function renderHistory(){
  if(view.day){
    const s = dayStats(view.day), d = parseKey(view.day);
    return `
      <button class="back" data-act="back">‹ Histórico</button>
      <h1>${dayLabel(d)}</h1>
      <div class="sub">${DOW_LONG[d.getDay()]}</div>
      <div class="card"><div class="plate">${plateSVG(s)}
        <div><div class="big">${s.pct}<small>%</small></div>
        <div class="sub">${s.done} de ${s.planned} refeições</div>${goalChip(s.goal.st, s.isToday)}</div></div></div>
      ${mealList(s)}
      ${summaryCard(s, 'Resumo')}`;
  }
  const keys = trackedDays(14);
  const stats = keys.map(dayStats);
  const week = stats.slice(0, 7).filter(x => x.planned);
  const avg = week.length ? Math.round(week.reduce((a,x) => a + x.pct, 0) / week.length) : 0;
  const met = week.filter(x => x.goal.st === 'met').length;
  // sequência: dias seguidos com meta atingida (hoje só conta se já atingiu)
  let streak = 0;
  for(let i = 0; i < stats.length; i++){
    const x = stats[i];
    if(!x.planned) continue;
    if(x.goal.st === 'met') streak++;
    else if(i === 0 && x.isToday) continue;
    else break;
  }
  const rows = stats.map(x => {
    const d = parseKey(x.key);
    return `<button class="dayrow" data-act="day" data-day="${x.key}">
      <span class="d">${x.isToday ? 'Hoje' : dayLabel(d)}</span>
      <span class="bar"><i style="width:${x.pct}%"></i></span>
      <span class="p">${x.planned ? x.pct + '%' : '–'}</span>
      <span class="dot ${x.goal.st}" title="${x.goal.st}"></span>
    </button>`;
  }).join('');
  return `
    <h1>Histórico</h1>
    <div class="sub">Meta: ${goalText()}</div>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><b>${avg}%</b><span>média 7 dias</span></div>
      <div class="stat"><b>${met}/${week.length}</b><span>dias com meta</span></div>
      <div class="stat"><b>${streak}</b><span>${streak === 1 ? 'dia seguido' : 'dias seguidos'}</span></div>
    </div>
    <div style="margin-top:16px">${rows}</div>
    <p class="note">Toque em um dia para ver ou corrigir os registros.</p>`;
}

function dowButtons(m){
  return DOW.map((l,i) => `<button class="${m.days.includes(i)?'on':''}" data-act="dow" data-id="${m.id}" data-d="${i}">${l}</button>`).join('');
}

function renderSettings(){
  const g = state.settings;
  const sched = scheduleInfo();
  const mealsHtml = state.meals.slice().sort((a,b) => toMin(a.time) - toMin(b.time)).map(m => {
    const open = openMeals.has(m.id);
    return `<div class="mcard">
      <button class="mhead" data-act="mopen" data-id="${m.id}">
        <span>${esc(m.name)} <em>${m.time}${m.enabled ? '' : ' · desligada'}</em></span><em>${open ? '▴' : '▾'}</em>
      </button>
      ${open ? `
        <label class="f">Nome</label>
        <input data-meal="${m.id}" data-field="name" value="${esc(m.name)}">
        <label class="f">Texto da notificação</label>
        <input data-meal="${m.id}" data-field="notif" value="${esc(m.notif)}">
        <label class="f">Horário do lembrete</label>
        <input type="time" data-meal="${m.id}" data-field="time" value="${m.time}">
        <label class="f">Dias da semana</label>
        <div class="dows">${dowButtons(m)}</div>
        <label class="f">O que comer (aparece no card)</label>
        <textarea data-meal="${m.id}" data-field="tip">${esc(m.tip)}</textarea>
        <div class="switch"><span>Refeição ativa</span>
          <input type="checkbox" data-meal="${m.id}" data-field="enabled" ${m.enabled?'checked':''}></div>
        <button class="btn danger block" data-act="mdel" data-id="${m.id}">Excluir refeição</button>
      ` : ''}
    </div>`;
  }).join('');

  return `
    <h1>Ajustes</h1>

    <div class="card">
      <h2>Meta do dia</h2>
      <label class="f">Objetivo</label>
      <select data-set="goalType">
        <option value="percent" ${g.goalType==='percent'?'selected':''}>Seguir pelo menos X% da dieta</option>
        <option value="all" ${g.goalType==='all'?'selected':''}>Fazer todas as refeições do dia</option>
        <option value="ontime" ${g.goalType==='ontime'?'selected':''}>Fazer todas dentro do horário</option>
        <option value="maxlate" ${g.goalType==='maxlate'?'selected':''}>No máximo X refeições atrasadas ou puladas</option>
      </select>
      ${(g.goalType==='percent'||g.goalType==='maxlate') ? `
        <label class="f">${g.goalType==='percent' ? 'Percentual mínimo (%)' : 'Máximo de refeições com problema'}</label>
        <input type="number" inputmode="numeric" min="0" max="100" data-set="goalValue" value="${g.goalValue}">` : ''}
      <label class="f">Tolerância de horário (minutos)</label>
      <input type="number" inputmode="numeric" min="0" max="240" data-set="tolerance" value="${g.tolerance}">
      <p class="note">Uma refeição conta como no horário se você marcar até o horário do lembrete + a tolerância. Depois disso, o atraso é contado a partir do fim da tolerância.</p>
    </div>

    <div class="card">
      <h2>Lembretes</h2>
      <div class="switch"><span>Enviar notificações</span>
        <input type="checkbox" data-set="ntfyOn" ${g.ntfyOn?'checked':''}></div>
      <label class="f">Seu tópico no ntfy (assine este nome no app ntfy)</label>
      <div class="row"><input readonly value="${esc(g.topic)}" id="topicBox"><button class="btn fit" data-act="copytopic">Copiar</button></div>
      <button class="btn block" data-act="test">Enviar notificação de teste</button>
      <button class="btn block" data-act="resched">Agendar lembretes agora</button>
      ${notice.notif ? `<div class="msg ${notice.notifErr?'err':'ok'}">${esc(notice.notif)}</div>` : ''}
      <div class="msg ${sched.ok?'ok':''}">${esc(sched.msg)}</div>
      <div class="switch" style="margin-top:10px"><span>Lembrete para fechar o dia</span>
        <input type="checkbox" data-set="closeOn" ${g.closeOn?'checked':''}></div>
      ${g.closeOn ? `<label class="f">Horário do fechamento</label>
        <input type="time" data-set="closeTime" value="${g.closeTime}">` : ''}
      <label class="f">Servidor ntfy</label>
      <input data-set="server" value="${esc(g.server)}" autocapitalize="off" autocorrect="off">
      <button class="btn block" data-act="newtopic">Gerar novo tópico</button>
      <p class="note">Como configurar:</p>
      <ol class="steps">
        <li>Instale o app gratuito <b>ntfy</b> na App Store.</li>
        <li>No ntfy, toque em <b>+</b>, mantenha o servidor <code>ntfy.sh</code> e digite o tópico acima.</li>
        <li>Permita as notificações quando o iPhone pedir.</li>
        <li>Volte aqui e toque em <b>Enviar notificação de teste</b>.</li>
      </ol>
      <p class="note">Os lembretes dos próximos 3 dias são agendados toda vez que você abre este app. Se mudar horários, os lembretes antigos já agendados ainda chegam; para descartá-los, gere um novo tópico e assine de novo no ntfy.</p>
    </div>

    <div class="card">
      <h2>Refeições</h2>
      ${mealsHtml}
      <button class="btn block" data-act="madd">Adicionar refeição</button>
      <button class="btn block" data-act="mreset">Restaurar refeições do plano</button>
    </div>

    <div class="card">
      <h2>Backup</h2>
      <p class="note" style="margin-top:0">Seus dados ficam só neste aparelho. Copie um backup de vez em quando.</p>
      <button class="btn block" data-act="export">Copiar backup</button>
      <textarea id="importBox" placeholder="Cole aqui um backup para restaurar" style="margin-top:8px"></textarea>
      <button class="btn block" data-act="import">Restaurar backup</button>
      ${notice.backup ? `<div class="msg ${notice.backupErr?'err':'ok'}">${esc(notice.backup)}</div>` : ''}
      <button class="btn danger block" data-act="wipe">Apagar histórico de refeições</button>
    </div>`;
}

function render(){
  renderTabs();
  $app.innerHTML = view.tab === 'today' ? renderToday() : view.tab === 'history' ? renderHistory() : renderSettings();
}

/* Modal para registrar horário / pular / limpar */
function renderModal(){
  if(!modalCtx){ $modal.className = ''; $modal.innerHTML = ''; return; }
  const m = state.meals.find(x => x.id === modalCtx.id); if(!m){ modalCtx = null; return renderModal(); }
  const e = (state.log[modalCtx.key] || {})[m.id];
  const isToday = modalCtx.key === dayKey(new Date());
  const val = e && e.at ? e.at : (isToday ? minToTime(nowMin()) : m.time);
  $modal.className = 'show';
  $modal.innerHTML = `<div class="sheet">
    <h2>${esc(m.name)}</h2>
    <div class="sub">${dayLabel(parseKey(modalCtx.key))} · lembrete às ${m.time}</div>
    <label class="f">Que horas você comeu?</label>
    <input type="time" id="modalTime" value="${val}">
    <button class="btn primary block" data-act="msave">Marcar como feita</button>
    <button class="btn block" data-act="mskip">Pulei esta refeição</button>
    <button class="btn block" data-act="mclear">Limpar registro</button>
    <button class="btn block" data-act="mclose">Cancelar</button>
  </div>`;
}

/* ============================================================
   Ações
   ============================================================ */
function setLog(key, id, entry){
  state.log[key] = state.log[key] || {};
  if(entry) state.log[key][id] = entry; else delete state.log[key][id];
  save();
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id, key = el.dataset.day;
  const today = dayKey(new Date());

  switch(act){
    case 'tab': view = { tab: el.dataset.tab, day: null }; render(); scrollTo(0,0); break;
    case 'day': view.day = key; render(); scrollTo(0,0); break;
    case 'back': view.day = null; render(); break;
    case 'tip': openTips.has(id) ? openTips.delete(id) : openTips.add(id); render(); break;
    case 'toggle': {
      const cur = (state.log[key] || {})[id];
      if(cur && cur.status === 'done'){ setLog(key, id, null); render(); }
      else if(key === today){ setLog(key, id, { status:'done', at: minToTime(nowMin()) }); render(); schedule(); }
      else { modalCtx = { key, id }; renderModal(); }
      break;
    }
    case 'more': modalCtx = { key, id }; renderModal(); break;
    case 'msave': {
      const t = $('#modalTime').value || minToTime(nowMin());
      setLog(modalCtx.key, modalCtx.id, { status:'done', at:t }); modalCtx = null; renderModal(); render(); break;
    }
    case 'mskip': setLog(modalCtx.key, modalCtx.id, { status:'skipped' }); modalCtx = null; renderModal(); render(); break;
    case 'mclear': setLog(modalCtx.key, modalCtx.id, null); modalCtx = null; renderModal(); render(); break;
    case 'mclose': modalCtx = null; renderModal(); break;

    case 'mopen': openMeals.has(id) ? openMeals.delete(id) : openMeals.add(id); render(); break;
    case 'dow': {
      const m = state.meals.find(x => x.id === id), d = Number(el.dataset.d);
      m.days = m.days.includes(d) ? m.days.filter(x => x !== d) : [...m.days, d].sort();
      save(); render(); break;
    }
    case 'mdel':
      if(confirm('Excluir esta refeição?')){ state.meals = state.meals.filter(x => x.id !== id); save(); render(); }
      break;
    case 'madd': {
      const m = { id: uid(), name:'Nova refeição', notif:'Hora da nova refeição', time:'16:00', days:[...ALL], enabled:true, tip:'' };
      state.meals.push(m); openMeals.add(m.id); save(); render(); break;
    }
    case 'mreset':
      if(confirm('Voltar às 7 refeições do plano? Suas edições nas refeições serão perdidas.')){ state.meals = DEFAULT_MEALS(); save(); render(); }
      break;

    case 'copytopic':
      try{ await navigator.clipboard.writeText(state.settings.topic); notice = { notif:'Tópico copiado.' }; }
      catch(e){ const b = $('#topicBox'); b.select(); notice = { notif:'Selecione e copie o tópico manualmente.', notifErr:true }; }
      render(); break;
    case 'newtopic':
      if(confirm('Gerar um novo tópico? Você precisará assinar o novo nome no app ntfy, e os lembretes já agendados no tópico antigo deixam de chegar.')){
        state.settings.topic = randTopic(); state.scheduled = {}; save();
        notice = { notif:'Novo tópico criado. Assine-o no ntfy e toque em "Agendar lembretes agora".' }; render();
      }
      break;
    case 'test':
      try{
        await publish({ title:'Teste de lembrete', message:'Se você viu isso, as notificações da dieta estão funcionando.' });
        notice = { notif:'Teste enviado. Deve chegar em alguns segundos.' };
      }catch(e){ notice = { notif:'Não foi possível enviar: ' + e.message, notifErr:true }; }
      render(); break;
    case 'resched': {
      notice = { notif:'Agendando...' }; render();
      const r = await schedule(true);
      notice = { notif: r.msg, notifErr: !r.ok }; render(); break;
    }
    case 'export':
      try{ await navigator.clipboard.writeText(JSON.stringify(state)); notice = { backup:'Backup copiado. Cole em um lugar seguro (Notas, e-mail).' }; }
      catch(e){ $('#importBox').value = JSON.stringify(state); notice = { backup:'Copie o texto da caixa abaixo.' }; }
      render(); break;
    case 'import':
      try{
        const raw = $('#importBox').value.trim(); const s = JSON.parse(raw);
        if(!s.meals || !s.settings || !s.log) throw new Error('formato inválido');
        state = { ...DEFAULT_STATE(), ...s, settings: { ...DEFAULT_STATE().settings, ...s.settings } };
        save(); notice = { backup:'Backup restaurado.' };
      }catch(e){ notice = { backup:'Backup inválido: ' + e.message, backupErr:true }; }
      render(); break;
    case 'wipe':
      if(confirm('Apagar todo o histórico de checks? As configurações são mantidas.')){
        state.log = {}; state.startDate = dayKey(new Date()); save(); render();
      }
      break;
  }
});

document.addEventListener('change', ev => {
  const el = ev.target;
  if(el.dataset.set){
    const k = el.dataset.set;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if(['goalValue','tolerance'].includes(k)) v = Math.max(0, Number(v) || 0);
    if(k === 'server') v = String(v).trim() || 'https://ntfy.sh';
    state.settings[k] = v; save(); render();
    if(['ntfyOn','closeOn','closeTime','server'].includes(k)) schedule();
  } else if(el.dataset.meal){
    const m = state.meals.find(x => x.id === el.dataset.meal); if(!m) return;
    m[el.dataset.field] = el.type === 'checkbox' ? el.checked : el.value;
    if(el.dataset.field === 'name' && /^Hora d/.test(m.notif || '') === false && !m.notif) m.notif = 'Hora de ' + m.name;
    save(); render();
    if(['time','enabled'].includes(el.dataset.field)) schedule();
  }
});

/* ============================================================
   Lembretes via ntfy (agendados com antecedência no servidor)
   ============================================================ */
async function publish(extra){
  const s = state.settings;
  const body = {
    topic: s.topic, tags: ['fork_and_knife'],
    click: location.origin + location.pathname,
    ...extra,
  };
  const r = await fetch(s.server.replace(/\/+$/, '') + '/', { method:'POST', body: JSON.stringify(body) });
  if(!r.ok) throw new Error('servidor respondeu ' + r.status);
}

function scheduleInfo(){
  const s = state.settings;
  if(!s.ntfyOn) return { ok:false, msg:'Notificações desligadas.' };
  const now = Date.now();
  const times = Object.values(state.scheduled).filter(t => t > now);
  if(!times.length) return { ok:false, msg:'Nenhum lembrete agendado ainda. Configure o ntfy e toque em "Agendar lembretes agora".' };
  const last = new Date(Math.max(...times));
  return { ok:true, msg:`${pl(times.length, 'lembrete agendado', 'lembretes agendados')}, até ${dayLabel(last)} às ${pad(last.getHours())}:${pad(last.getMinutes())}. Abra o app ao menos a cada 2 dias para renovar.` };
}

let scheduling = false;
async function schedule(manual){
  const s = state.settings;
  if(!s.ntfyOn) return { ok:false, msg:'Notificações desligadas.' };
  if(scheduling) return { ok:true, msg:'Agendamento em andamento.' };
  scheduling = true;
  try{
    const now = Date.now(), events = [];
    for(let off = 0; off <= 3; off++){
      const d = new Date(); d.setDate(d.getDate() + off); d.setHours(0,0,0,0);
      const key = dayKey(d), dow = d.getDay();
      const at = hhmm => { const [h,mi] = hhmm.split(':').map(Number); const t = new Date(d); t.setHours(h, mi, 0, 0); return t.getTime(); };
      state.meals.filter(m => m.enabled && m.days.includes(dow)).forEach(m =>
        events.push({ k:`${key}|${m.id}|${m.time}`, t:at(m.time), title: m.notif || ('Hora de ' + m.name), msg: m.tip || '' }));
      if(s.closeOn) events.push({ k:`${key}|close|${s.closeTime}`, t:at(s.closeTime),
        title:'Hora de fechar o dia', msg:'Abra o app, confira seus checks e veja o resumo do dia.' });
    }
    const MAX = 71 * 3600e3;
    let sent = 0;
    for(const ev of events){
      const delta = ev.t - now;
      if(delta < 30e3 || delta > MAX || state.scheduled[ev.k]) continue;
      await publish({ title: ev.title, message: ev.msg || ev.title, delay: Math.round(delta/1000) + 's' });
      state.scheduled[ev.k] = ev.t; sent++;
      await new Promise(r => setTimeout(r, 120));
    }
    for(const k in state.scheduled) if(state.scheduled[k] < now - 86400e3) delete state.scheduled[k];
    save();
    const info = scheduleInfo();
    return { ok: info.ok, msg: sent ? `${pl(sent, 'novo lembrete agendado', 'novos lembretes agendados')}. ` + info.msg : info.msg };
  }catch(e){
    save();
    return { ok:false, msg:'Falha ao agendar: ' + e.message + '. Verifique a internet e o servidor.' };
  }finally{
    scheduling = false;
    if(view.tab === 'today' && !manual && !modalCtx) render();
  }
}

/* ============================================================
   Início
   ============================================================ */
const $app = document.getElementById('app');
const $modal = document.getElementById('modal');
const $tabs = document.getElementById('tabs');
const $ = s => document.querySelector(s);

$modal.addEventListener('click', e => { if(e.target === $modal){ modalCtx = null; renderModal(); } });

render();
schedule();
setInterval(() => { if(!document.hidden && view.tab === 'today' && !modalCtx) render(); }, 30000);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ if(!modalCtx && view.tab !== 'settings') render(); schedule(); } });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
